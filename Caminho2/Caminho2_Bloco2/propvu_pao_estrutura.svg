<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="380" fill="white"/><text x="360.0" y="40" font-family="Poppins, Inter, sans-serif" font-size="22" font-weight="bold" fill="#14365A" text-anchor="middle">Fatias de pão para a festa</text><rect x="60" y="75" width="280" height="80" rx="12" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="200" y="108" font-family="Poppins, Inter, sans-serif" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">25 sanduíches</text><text x="200" y="134" font-family="Poppins, Inter, sans-serif" font-size="14" font-weight="normal" fill="#8A97A6" text-anchor="middle">2 fatias em cada um</text><rect x="400" y="75" width="260" height="80" rx="12" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2"/><text x="530" y="108" font-family="Poppins, Inter, sans-serif" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">1 pacote de pão</text><text x="530" y="134" font-family="Poppins, Inter, sans-serif" font-size="14" font-weight="normal" fill="#8A97A6" text-anchor="middle">8 fatias em cada pacote</text><line x1="200" y1="160" x2="200.0" y2="196.0" stroke="#E0701B" stroke-width="2.6"/><polygon points="200,205 206.0,196.0 194.0,196.0" fill="#E0701B"/><rect x="90" y="210" width="220" height="55" rx="12" fill="#FCEBD9" stroke="#E0701B" stroke-width="2.2" stroke-dasharray="6,5"/><text x="200" y="244" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="bold" fill="#E0701B" text-anchor="middle">? fatias ao todo</text><rect x="150" y="295" width="420" height="65" rx="14" fill="#FCEBD9" stroke="#E0701B" stroke-width="2.5" stroke-dasharray="6,5"/><text x="360" y="325" font-family="Poppins, Inter, sans-serif" font-size="16" font-weight="normal" fill="#14365A" text-anchor="middle">Quantos pacotes, no mínimo,</text><text x="360" y="348" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="bold" fill="#E0701B" text-anchor="middle">para não faltar fatia