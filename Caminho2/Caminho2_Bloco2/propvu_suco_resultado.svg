<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="300" fill="white"/><text x="360.0" y="40" font-family="Poppins, Inter, sans-serif" font-size="21" font-weight="bold" fill="#14365A" text-anchor="middle">Quantos copos cabem em 5 garrafas</text><rect x="160" y="70" width="400" height="70" rx="12" fill="#EEE8FA" stroke="#7A5CC0" stroke-width="2"/><text x="360" y="105" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="bold" fill="#7A5CC0" text-anchor="middle">12 ÷ 3 = 4</text><text x="360" y="128" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#8A97A6" text-anchor="middle">(1 garrafa vale 4 copos)</text><line x1="360" y1="150" x2="360.0" y2="181.0" stroke="#8A97A6" stroke-width="2.6"/><polygon points="360,190 366.0,181.0 354.0,181.0" fill="#8A97A6"/><rect x="160" y="195" width="400" height="80" rx="16" fill="#FCEFC2" stroke="#F6C445" stroke-width="3"/><text x="360" y="232" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="bold" fill="#14365A" text-anchor="middle">4 × 5 = 20</text><text x="360" y="260" font-family="Poppins, Inter, sans-serif" font-size="16" font-weight="normal" fill="#14365A" text-anchor="middle">Cabem 20 copos em 5 garrafas</text></svg>