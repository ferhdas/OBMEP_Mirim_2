<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .caixas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .caixa{border-radius:10px;padding:12px;text-align:center;border:2px solid;}
  .caixa.a{background:#fff7ed;border-color:#f97316;}
  .caixa.b{background:#f5f3ff;border-color:var(--roxo);}
  .caixa .rotulo{font-weight:700;font-size:15px;margin-bottom:6px;}
  .caixa .qtd{font-size:13px;color:#6b7280;margin-bottom:2px;}
  .caixa .preco{font-family:"Courier New",monospace;font-size:18px;font-weight:700;}
  .caixa.a .preco{color:#c2410c;}
  .caixa.b .preco{color:var(--roxo);}
  .pedido{display:flex;justify-content:center;gap:10px;align-items:center;
          background:#f3f4f6;border-radius:10px;padding:10px 8px;margin-bottom:16px;
          font-weight:700;font-size:15px;flex-wrap:wrap;}
  .chip{padding:6px 12px;border-radius:8px;color:#fff;font-family:"Courier New",monospace;}
  .chip.a{background:#f97316;}
  .chip.b{background:var(--roxo);}
  .opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  button.opcao{padding:12px 6px;font-size:15px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;
               font-family:"Courier New",monospace;font-weight:700;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="caixas">
    <div class="caixa a">
      <div class="rotulo">Caixa A</div>
      <div class="qtd">4 unid.</div>
      <div class="preco">R$ 12</div>
    </div>
    <div class="caixa b">
      <div class="rotulo">Caixa B</div>
      <div class="qtd">5 unid.</div>
      <div class="preco">R$ 20</div>
    </div>
  </div>
  <div class="pedido">
    <span class="chip a">3 × A</span><span>+</span><span class="chip b">2 × B</span><span>= ?</span>
  </div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var CORRETA = 17;
  var opcoesVal = [15, 17, 18, 20, 21];
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  opcoesVal.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = 'R$ ' + v;
    b.dataset.valor = v;
    b.onclick = function(){ escolher(b, v); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (parseInt(btn.dataset.valor, 10) === CORRETA) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETA);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! Resposta certa.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Tente outra opção.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era R$ ' + CORRETA + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
