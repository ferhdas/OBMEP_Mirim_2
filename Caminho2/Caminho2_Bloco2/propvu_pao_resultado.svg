<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="420" fill="white"/><text x="360.0" y="40" font-family="Poppins, Inter, sans-serif" font-size="20" font-weight="bold" fill="#14365A" text-anchor="middle">Quantos pacotes a cozinha precisa comprar</text><rect x="200" y="65" width="320" height="60" rx="12" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="360" y="100" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#2F80C4" text-anchor="middle">25 × 2 = 50 fatias</text><line x1="360" y1="128" x2="360.0" y2="151.0" stroke="#8A97A6" stroke-width="2.6"/><polygon points="360,160 366.0,151.0 354.0,151.0" fill="#8A97A6"/><rect x="60" y="165" width="280" height="90" rx="12" fill="#EEF3F8" stroke="#8A97A6" stroke-width="2"/><text x="200" y="195" font-family="Poppins, Inter, sans-serif" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">6 pacotes</text><text x="200" y="220" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#14365A" text-anchor="middle">6 × 8 = 48 fatias</text><line x1="298" y1="198" x2="322" y2="222" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/><line x1="298" y1="222" x2="322" y2="198" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/><text x="200" y="244" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#C0392B" text-anchor="middle">não é suficiente</text><rect x="380" y="165" width="280" height="90" rx="12" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2"/><text x="520" y="195" font-family="Poppins, Inter, sans-serif" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">7 pacotes</text><text x="520" y="220" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#14365A" text-anchor="middle">7 × 8 = 56 fatias</text><polyline points="617,210 625.7,219.1 643,199.6" fill="none" stroke="#3E9B6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="244" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#3E9B6B" text-anchor="middle">é suficiente</text><rect x="160" y="275" width="400" height="90" rx="16" fill="#FCEFC2" stroke="#F6C445" stroke-width="3"/><text x="360" y="315" font-family="Poppins, Inter, sans-serif" font-size="26" font-weight="bold" fill="#14365A" text-anchor="middle">Resposta: 7 pacotes</text><text x="360" y="345" font-family="Poppins, Inter, sans-serif" font-size="14" font-weight="normal" fill="#8A97A6" text-anchor="middle">(sobram 6 fatias)</text></svg>