<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .dado{display:flex;justify-content:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .bloco{flex:1;min-width:140px;text-align:center;border-radius:10px;padding:10px;border:2px solid;}
  .bloco.precisa{background:#fff7ed;border-color:#f97316;}
  .bloco.pacote{background:#f5f3ff;border-color:var(--roxo);}
  .bloco .num{font-family:"Courier New",monospace;font-size:22px;font-weight:700;}
  .bloco.precisa .num{color:#c2410c;}
  .bloco.pacote .num{color:var(--roxo);}
  .bloco .rot{font-size:12px;color:#6b7280;margin-top:2px;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
  .stepper button{width:44px;height:44px;border-radius:10px;border:2px solid #d1d5db;
                  background:#fff;font-size:18px;font-weight:700;cursor:pointer;
                  transition:all .2s ease;font-family:"Courier New",monospace;}
  .stepper button:hover:not(:disabled){border-color:var(--roxo);}
  .stepper button:disabled{opacity:.5;cursor:default;}
  #qtdPacotes{min-width:60px;text-align:center;font-size:24px;font-weight:700;
              font-family:"Courier New",monospace;}
  .rot-pacotes{text-align:center;font-size:12px;color:#6b7280;margin-bottom:12px;}
  .barra-fundo{background:#f3f4f6;border-radius:8px;height:22px;margin-bottom:6px;overflow:hidden;}
  .barra-cheia{height:100%;border-radius:8px;transition:width .25s ease, background .25s ease;
               background:var(--vermelho);width:0%;}
  #coberturaTexto{text-align:center;font-size:13px;color:#6b7280;margin-bottom:14px;font-family:"Courier New",monospace;}
  #comprar{display:block;margin:0 auto;padding:12px 28px;font-size:15px;font-weight:700;
           border-radius:10px;border:none;background:var(--roxo);color:#fff;cursor:pointer;
           transition:all .2s ease;}
  #comprar:hover:not(:disabled){background:#6b21a8;}
  #comprar:disabled{opacity:.6;cursor:default;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="dado">
    <div class="bloco precisa"><div class="num">46</div><div class="rot">precisa</div></div>
    <div class="bloco pacote"><div class="num">8</div><div class="rot">por pacote</div></div>
  </div>
  <div class="stepper">
    <button id="menos" type="button">−1</button>
    <span id="qtdPacotes">0</span>
    <button id="mais" type="button">+1</button>
  </div>
  <div class="rot-pacotes">pacotes escolhidos</div>
  <div class="barra-fundo"><div class="barra-cheia" id="barra"></div></div>
  <div id="coberturaTexto">0 de 46</div>
  <button id="comprar" type="button">Comprar</button>
  <div id="msg"></div>
</div>
<script>
(function(){
  var NECESSARIO = 46;
  var POR_PACOTE = 8;
  var CORRETA = Math.ceil(NECESSARIO / POR_PACOTE); // 6
  var MIN = 0, MAX = 10;
  var pacotes = 0;
  var respondido = false, tentativas = 0, inicio = Date.now();

  var span = document.getElementById('qtdPacotes');
  var barra = document.getElementById('barra');
  var texto = document.getElementById('coberturaTexto');
  var msg = document.getElementById('msg');
  var btnComprar = document.getElementById('comprar');

  function atualizar(){
    span.textContent = pacotes;
    var coberto = pacotes * POR_PACOTE;
    var pct = Math.min(100, Math.round((coberto / NECESSARIO) * 100));
    barra.style.width = pct + '%';
    barra.style.background = coberto >= NECESSARIO ? '#16a34a' : '#dc2626';
    texto.textContent = coberto + ' de ' + NECESSARIO;
  }

  document.getElementById('menos').onclick = function(){
    pacotes = Math.max(MIN, pacotes - 1);
    atualizar();
  };
  document.getElementById('mais').onclick = function(){
    pacotes = Math.min(MAX, pacotes + 1);
    atualizar();
  };

  function travar(){
    document.getElementById('menos').disabled = true;
    document.getElementById('mais').disabled = true;
    btnComprar.disabled = true;
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  btnComprar.onclick = function(){
    if (respondido) return;
    tentativas++;
    var acertou = (pacotes === CORRETA);

    if (acertou){
      travar();
      msg.textContent = 'Isso! Esse é o número mínimo de pacotes.';
      msg.style.color = '#16a34a';
      enviar(true, pacotes);
      return;
    }

    if (tentativas < 2){
      if (pacotes * POR_PACOTE < NECESSARIO){
        msg.textContent = 'Ainda falta cobrir tudo. Ajuste e tente de novo.';
      } else {
        msg.textContent = 'Isso cobre, mas não é o mínimo. Ajuste e tente de novo.';
      }
      msg.style.color = '#dc2626';
      return;
    }

    var respostaAluno = pacotes;
    pacotes = CORRETA;
    atualizar();
    travar();
    msg.textContent = 'O mínimo era ' + CORRETA + ' pacotes.';
    msg.style.color = '#dc2626';
    enviar(false, respostaAluno);
  };

  atualizar();
})();
</script>
</body>
</html>
