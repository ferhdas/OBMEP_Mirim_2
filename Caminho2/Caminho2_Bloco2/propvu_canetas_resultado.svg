<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="420" fill="white"/><text x="360.0" y="40" font-family="Poppins, Inter, sans-serif" font-size="22" font-weight="bold" fill="#14365A" text-anchor="middle">Valor de cada caneta e o total</text><rect x="50" y="70" width="280" height="70" rx="12" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="190" y="100" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#2F80C4" text-anchor="middle">18 ÷ 6 = 3</text><text x="190" y="124" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#8A97A6" text-anchor="middle">(1 caneta azul)</text><rect x="390" y="70" width="280" height="70" rx="12" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2"/><text x="530" y="100" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#3E9B6B" text-anchor="middle">30 ÷ 6 = 5</text><text x="530" y="124" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#8A97A6" text-anchor="middle">(1 caneta verde)</text><rect x="50" y="170" width="280" height="70" rx="12" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="190" y="200" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#2F80C4" text-anchor="middle">3 × 3 = 9</text><text x="190" y="224" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#8A97A6" text-anchor="middle">(3 canetas azuis)</text><rect x="390" y="170" width="280" height="70" rx="12" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2"/><text x="530" y="200" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" fill="#3E9B6B" text-anchor="middle">3 × 5 = 15</text><text x="530" y="224" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="normal" fill="#8A97A6" text-anchor="middle">(3 canetas verdes)</text><line x1="190" y1="244" x2="291.7" y2="286.5" stroke="#8A97A6" stroke-width="2.6"/><polygon points="300,290 294.0,281.0 289.4,292.1" fill="#8A97A6"/><line x1="530" y1="244" x2="428.3" y2="286.5" stroke="#8A97A6" stroke-width="2.6"/><polygon points="420,290 430.6,292.1 426.0,281.0" fill="#8A97A6"/><rect x="160" y="300" width="400" height="90" rx="16" fill="#FCEFC2" stroke="#F6C445" stroke-width="3"/><text x="360" y="335" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">9 + 15 = 24</text><text x="360" y="368" font-family="Poppins, Inter, sans-serif" font-size="17" font-weight="normal" fill="#14365A" text-anchor="middle">Marcos paga R$ 24</text></svg>