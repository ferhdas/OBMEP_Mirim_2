<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 320 270"
   font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
   version="1.1"
   id="svg8"
   sodipodi:docname="frac_fig1_bolo.svg"
   inkscape:export-filename="frac_fig1_bolo.png"
   inkscape:export-xdpi="240"
   inkscape:export-ydpi="240"
   inkscape:version="1.4 (e7c3feb100, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs8" />
  <sodipodi:namedview
     id="namedview8"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false"
     inkscape:zoom="1.89375"
     inkscape:cx="165.28053"
     inkscape:cy="148.91089"
     inkscape:window-width="1366"
     inkscape:window-height="696"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg8" />
  <rect
     width="320"
     height="270"
     fill="#faf9f5"
     rx="10"
     id="rect1" />
  <text
     x="160"
     y="24"
     text-anchor="middle"
     font-size="13"
     fill="#1A2F4F"
     font-weight="bold"
     id="text1">Um bolo dividido em 6 fatias iguais</text>
  <!--
    6 fatias de 60° cada, numeradas de 0 a 5.
    Ângulo de partida: -90° (topo).
    Fatia k: de (-90 + 60k)° a (-90 + 60(k+1))°.
    Coordenadas do arco (r=90, centro 160,150):
      cos/sen em graus, x = cx + r*cos(ang), y = cy + r*sen(ang)
    k=0: -90° a -30°  => (160,60) a (237.9,105)
    k=1: -30° a  30°  => (237.9,105) a (237.9,195)
    k=2:  30° a  90°  => (237.9,195) a (160,240)
    k=3:  90° a 150° => (160,240) a (82.1,195)
    k=4: 150° a 210° => (82.1,195) a (82.1,105)
    k=5: 210° a 270°(=-90°) => (82.1,105) a (160,60)

    Fatias coloridas (laranja): k=0 e k=1
    Fatias restantes (bege): k=2,3,4,5
  -->
  <g
     transform="translate(0,-20)"
     id="g6">
    <!-- Fatia 0: laranja -->
    <path
       d="M 160,150 V 60 a 90,90 0 0 1 77.9,45 z"
       fill="#e5532e"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path1" />
    <!-- Fatia 1: laranja -->
    <path
       d="m 160,150 77.9,-45 a 90,90 0 0 1 0,90 z"
       fill="#e5532e"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path2" />
    <!-- Fatia 2: bege -->
    <path
       d="m 160,150 77.9,45 A 90,90 0 0 1 160,240 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path3" />
    <!-- Fatia 3: bege -->
    <path
       d="m 160,150 v 90 A 90,90 0 0 1 82.1,195 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path4" />
    <!-- Fatia 4: bege -->
    <path
       d="m 160,150 -77.9,45 a 90,90 0 0 1 0,-90 z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path5" />
    <!-- Fatia 5: bege -->
    <path
       d="M 160,150 82.1,105 A 90,90 0 0 1 160,60 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path6" />
    <!-- Contorno -->
    <circle
       cx="160"
       cy="150"
       r="90"
       fill="none"
       stroke="#1a2f4f"
       stroke-width="2"
       id="circle6" />
  </g>
  <!-- Legenda -->
  <rect
     x="30"
     y="235"
     width="14"
     height="14"
     fill="#e5532e"
     rx="2"
     id="rect6" />
  <text
     x="50"
     y="247"
     font-size="12px"
     fill="#1a2f4f"
     id="text6">2 fatias servidas</text>
  <rect
     x="170"
     y="235"
     width="14"
     height="14"
     fill="#e8d4a8"
     stroke="#1a2f4f"
     stroke-width="1"
     rx="2"
     id="rect7" />
  <text
     x="190"
     y="247"
     font-size="12px"
     fill="#1a2f4f"
     id="text7">4 fatias restantes</text>
</svg>
