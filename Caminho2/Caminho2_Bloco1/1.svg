<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- FIGURA 1: Torta dividida em 8 fatias iguais, 3 delas hachuradas em laranja -->

<svg
   viewBox="0 0 320 260"
   font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
   version="1.1"
   id="svg10"
   sodipodi:docname="1.svg"
   inkscape:version="1.4 (e7c3feb100, 2024-10-09)"
   inkscape:export-filename="1.png"
   inkscape:export-xdpi="240"
   inkscape:export-ydpi="240"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs10" />
  <sodipodi:namedview
     id="namedview10"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.1230769"
     inkscape:cx="150.25362"
     inkscape:cy="135.65217"
     inkscape:window-width="1366"
     inkscape:window-height="761"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="g8" />
  <!-- Fundo -->
  <rect
     width="320"
     height="260"
     fill="#faf9f5"
     rx="10"
     id="rect1" />
  <!-- Título -->
  <text
     x="160"
     y="24"
     text-anchor="middle"
     font-size="13"
     fill="#1A2F4F"
     font-weight="bold"
     id="text1">Uma torta dividida em 8 fatias iguais</text>
  <!-- Círculo base (torta) -->
  <g
     transform="translate(160,126)"
     id="g8">
    <!-- 8 fatias: ângulos de 0° a 360° em passos de 45° -->
    <!-- Fatias NÃO hachuradas (partes restantes) — 5 fatias em bege -->
    <!-- fatia 3: 90°–135° -->
    <path
       d="m 0,0 v -85 a 85,85 0 0 1 60.1,24.9 z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path1" />
    <!-- fatia 4: 135°–180° -->
    <path
       d="M 0,0 60.1,-60.1 A 85,85 0 0 1 85,0 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path2" />
    <!-- fatia 5: 180°–225° -->
    <path
       d="M 0,0 H 85 A 85,85 0 0 1 60.1,60.1 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path3" />
    <!-- fatia 6: 225°–270° -->
    <path
       d="M 0,0 60.1,60.1 A 85,85 0 0 1 0,85 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path4" />
    <!-- fatia 7: 270°–315° -->
    <path
       d="M 0,0 V 85 A 85,85 0 0 1 -60.1,60.1 Z"
       fill="#e8d4a8"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path5" />
    <!-- Fatias HACHURADAS (partes comidas) — 3 fatias em laranja -->
    <!-- fatia 0: 315°–360°(=0°) -->
    <path
       d="M 0,0 -60.1,60.1 A 85,85 0 0 1 -85,0 Z"
       fill="#e5532e"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path6"
       style="fill:#ffffff;fill-opacity:1" />
    <!-- fatia 1: 0°–45° -->
    <path
       d="m 0,0 h -85 a 85,85 0 0 1 24.9,-60.1 z"
       fill="#e5532e"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path7"
       style="fill:#ffffff;fill-opacity:1" />
    <!-- fatia 2: 45°–90° -->
    <path
       d="M 0,0 -60.1,-60.1 A 85,85 0 0 1 0,-85 Z"
       fill="#e5532e"
       stroke="#1a2f4f"
       stroke-width="1.5"
       id="path8"
       style="fill:#ffffff;fill-opacity:1" />
    <!-- Contorno geral -->
    <circle
       cx="0"
       cy="0"
       r="85"
       fill="none"
       stroke="#1a2f4f"
       stroke-width="2"
       id="circle8" />
  </g>
  <!-- Legenda -->
  <rect
     x="30"
     y="222"
     width="14"
     height="14"
     fill="#e5532e"
     rx="2"
     id="rect8"
     style="fill:#fefaf9;fill-opacity:1;stroke:#000000;stroke-opacity:1" />
  <text
     x="50"
     y="234"
     font-size="12px"
     fill="#1a2f4f"
     id="text8">3 fatias comidas</text>
  <rect
     x="160"
     y="222"
     width="14"
     height="14"
     fill="#e8d4a8"
     stroke="#1a2f4f"
     stroke-width="1"
     rx="2"
     id="rect9" />
  <text
     x="180"
     y="234"
     font-size="12px"
     fill="#1a2f4f"
     id="text9">5 fatias restantes</text>
  <!-- Fração indicada -->
  <text
     x="160"
     y="254"
     text-anchor="middle"
     font-size="12px"
     fill="#4a6fa5"
     id="text10">3/8 da torta foram comidas, 5/8 da torta sobraram</text>
</svg>
