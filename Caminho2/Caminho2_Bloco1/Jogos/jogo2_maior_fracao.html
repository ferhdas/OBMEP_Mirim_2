<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf9f5;
    padding: 20px;
    min-height: 200px;
  }
  #painel {
    background: #fff;
    border-radius: 12px;
    border: 2px solid #e2d9f3;
    padding: 20px;
    max-width: 520px;
    margin: 0 auto;
  }
  #rodada-info {
    font-size: 12px;
    color: #7e22ce;
    font-weight: 600;
    text-align: right;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  #grupos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
  }
  .grupo {
    border: 2.5px solid #c4b5e8;
    border-radius: 10px;
    background: #f5f0ff;
    padding: 12px 8px;
    text-align: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .grupo-rotulo {
    font-size: 12px;
    font-weight: 700;
    color: #3b0764;
    margin-bottom: 10px;
  }
  .bolinhas {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    min-height: 60px;
    align-content: center;
  }
  .bola {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid #c4b5e8;
  }
  .bola.marcada { background: #7e22ce; border-color: #5b21b6; }
  .bola.livre   { background: #e9e4f7; }

  .grupo-btn {
    margin-top: 12px;
    width: 100%;
    padding: 10px 6px;
    font-size: 14px;
    font-weight: 700;
    border: 2px solid #c4b5e8;
    border-radius: 8px;
    background: #fff;
    color: #3b0764;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .grupo-btn:hover:not(:disabled) {
    background: #ede9fe;
    border-color: #7e22ce;
  }
  .grupo-btn:disabled { cursor: default; }
  .grupo.correta  { background: #dcfce7; border-color: #16a34a; }
  .grupo.errada   { background: #fee2e2; border-color: #dc2626; }
  .grupo-btn.correta { background: #dcfce7; border-color: #16a34a; color: #14532d; }
  .grupo-btn.errada  { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }

  #feedback {
    margin-top: 4px;
    min-height: 28px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    border-radius: 8px;
    padding: 6px 0;
    transition: background 0.2s;
  }
  #feedback.ok  { background: #dcfce7; color: #15803d; }
  #feedback.nok { background: #fee2e2; color: #b91c1c; }

  #proximo-btn {
    display: none;
    margin: 14px auto 0;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    background: #7e22ce;
    color: #fff;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #proximo-btn:hover { background: #6b21a8; }
</style>
</head>
<body>
<div id="painel">
  <div id="rodada-info"></div>
  <div id="grupos"></div>
  <div id="feedback"></div>
  <button id="proximo-btn">Próxima →</button>
</div>

<script>
(function(){
  // ── Banco de rodadas ──────────────────────────────────────────────────────
  // Cada rodada compara dois grupos de bolinhas (total, marcadas).
  // correta: 'A' ou 'B' — o grupo com a MAIOR fração de bolinhas marcadas.
  var rodadas = [
    { a:{total:4,  marc:2}, b:{total:8,  marc:3}, correta:'A' },
    { a:{total:9,  marc:3}, b:{total:5,  marc:2}, correta:'B' },
    { a:{total:6,  marc:4}, b:{total:10, marc:5}, correta:'A' },
    { a:{total:3,  marc:1}, b:{total:8,  marc:2}, correta:'A' },
    { a:{total:12, marc:3}, b:{total:6,  marc:2}, correta:'B' },
    { a:{total:8,  marc:5}, b:{total:6,  marc:4}, correta:'B' },
  ];

  var ordemRodadas = [0,1,2,3,4,5];
  for(var i=ordemRodadas.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=ordemRodadas[i];ordemRodadas[i]=ordemRodadas[j];ordemRodadas[j]=t;
  }
  ordemRodadas = ordemRodadas.slice(0,4);

  var rodadaAtual = 0;
  var acertos = 0;
  var respondido = false;
  var respondidoFinal = false;
  var inicio = Date.now();

  function montaBolinhas(container, total, marcadas){
    container.innerHTML = '';
    for(var i=0;i<total;i++){
      var b = document.createElement('div');
      b.className = 'bola ' + (i < marcadas ? 'marcada' : 'livre');
      container.appendChild(b);
    }
  }

  function renderRodada(){
    var r = rodadas[ordemRodadas[rodadaAtual]];

    document.getElementById('rodada-info').textContent =
      'Rodada ' + (rodadaAtual+1) + ' de ' + ordemRodadas.length;

    var wrap = document.getElementById('grupos');
    wrap.innerHTML = '';

    var grupoA = document.createElement('div');
    grupoA.className = 'grupo';
    var rotA = document.createElement('div');
    rotA.className = 'grupo-rotulo';
    rotA.textContent = 'Grupo A';
    var bolinhasA = document.createElement('div');
    bolinhasA.className = 'bolinhas';
    montaBolinhas(bolinhasA, r.a.total, r.a.marc);
    var btnA = document.createElement('button');
    btnA.className = 'grupo-btn';
    btnA.textContent = 'Escolher A';
    btnA.onclick = function(){ escolher('A', grupoA, grupoB, btnA, btnB, r); };
    grupoA.appendChild(rotA);
    grupoA.appendChild(bolinhasA);
    grupoA.appendChild(btnA);

    var grupoB = document.createElement('div');
    grupoB.className = 'grupo';
    var rotB = document.createElement('div');
    rotB.className = 'grupo-rotulo';
    rotB.textContent = 'Grupo B';
    var bolinhasB = document.createElement('div');
    bolinhasB.className = 'bolinhas';
    montaBolinhas(bolinhasB, r.b.total, r.b.marc);
    var btnB = document.createElement('button');
    btnB.className = 'grupo-btn';
    btnB.textContent = 'Escolher B';
    btnB.onclick = function(){ escolher('B', grupoA, grupoB, btnA, btnB, r); };
    grupoB.appendChild(rotB);
    grupoB.appendChild(bolinhasB);
    grupoB.appendChild(btnB);

    wrap.appendChild(grupoA);
    wrap.appendChild(grupoB);

    var fb = document.getElementById('feedback');
    fb.textContent = '';
    fb.className = '';
    document.getElementById('proximo-btn').style.display = 'none';
    respondido = false;
  }

  function escolher(escolha, grupoA, grupoB, btnA, btnB, r){
    if(respondido) return;
    respondido = true;

    btnA.disabled = true;
    btnB.disabled = true;

    var grupoCorretoDiv = (r.correta === 'A') ? grupoA : grupoB;
    var btnCorretoEl = (r.correta === 'A') ? btnA : btnB;
    grupoCorretoDiv.classList.add('correta');
    btnCorretoEl.classList.add('correta');

    var eCorreta = (escolha === r.correta);
    if(!eCorreta){
      var grupoErradoDiv = (escolha === 'A') ? grupoA : grupoB;
      var btnErradoEl = (escolha === 'A') ? btnA : btnB;
      grupoErradoDiv.classList.add('errada');
      btnErradoEl.classList.add('errada');
    }

    var fb = document.getElementById('feedback');
    if(eCorreta){
      acertos++;
      fb.textContent = '✓ Correto!';
      fb.className = 'ok';
    } else {
      fb.textContent = '✗ Não é esse. O grupo com maior fração está em destaque.';
      fb.className = 'nok';
    }

    if(rodadaAtual >= ordemRodadas.length - 1){
      setTimeout(function(){
        encerrar();
      }, 1200);
    } else {
      document.getElementById('proximo-btn').style.display = 'block';
    }
  }

  function encerrar(){
    if(respondidoFinal) return;
    respondidoFinal = true;
    var acertouFinal = (acertos === ordemRodadas.length);
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertouFinal,
      meta: {
        tentativas: ordemRodadas.length,
        tempo: Math.round((Date.now()-inicio)/1000),
        resposta: acertos + '/' + ordemRodadas.length + ' acertos'
      }
    }, '*');
  }

  document.getElementById('proximo-btn').onclick = function(){
    rodadaAtual++;
    renderRodada();
  };

  renderRodada();
})();
</script>
</body>
</html>
