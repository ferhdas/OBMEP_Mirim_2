<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf9f5;
    padding: 20px;
    min-height: 200px;
  }
  #painel {
    background: #fff;
    border-radius: 12px;
    border: 2px solid #e2d9f3;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  #rodada-info {
    font-size: 12px;
    color: #7e22ce;
    font-weight: 600;
    text-align: right;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  #grade-wrap {
    display: flex;
    justify-content: center;
    margin: 16px 0 14px;
  }
  #grade {
    display: grid;
    gap: 5px;
  }
  .celula {
    width: 34px;
    height: 34px;
    border-radius: 7px;
    border: 2px solid #c4b5e8;
  }
  .celula.usada  { background: #d0d0d0; border-color: #9ca3af; }
  .celula.livre  { background: #e9e4f7; }

  #legenda {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 16px;
    font-size: 11px;
    color: #4b5563;
  }
  #legenda span { display: inline-flex; align-items: center; gap: 5px; }
  .quad { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  #pergunta-rotulo {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #3b0764;
    margin-bottom: 10px;
  }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stepper button {
    width: 42px;
    height: 42px;
    border-radius: 9px;
    border: 2px solid #c4b5e8;
    background: #f5f0ff;
    font-size: 17px;
    font-weight: 700;
    color: #3b0764;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .stepper button:hover:not(:disabled) {
    background: #ede9fe;
    border-color: #7e22ce;
  }
  .stepper button:disabled { opacity: 0.5; cursor: default; }
  #frac-mostrada {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    min-width: 48px;
    font-size: 22px;
    font-weight: 700;
    color: #1f2937;
    line-height: 1.15;
  }
  #frac-mostrada .barra {
    border-top: 2.5px solid currentColor;
    width: 100%;
    margin: 2px 0;
  }

  #confirmar-btn {
    display: block;
    margin: 0 auto;
    padding: 11px 30px;
    font-size: 14px;
    font-weight: 700;
    background: #7e22ce;
    color: #fff;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #confirmar-btn:hover:not(:disabled) { background: #6b21a8; }
  #confirmar-btn:disabled { opacity: 0.6; cursor: default; }

  #feedback {
    margin-top: 14px;
    min-height: 28px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    border-radius: 8px;
    padding: 6px 0;
  }
  #feedback.ok  { background: #dcfce7; color: #15803d; }
  #feedback.nok { background: #fee2e2; color: #b91c1c; }

  #proximo-btn {
    display: none;
    margin: 14px auto 0;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    background: #7e22ce;
    color: #fff;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #proximo-btn:hover { background: #6b21a8; }
</style>
</head>
<body>
<div id="painel">
  <div id="rodada-info"></div>
  <div id="grade-wrap"><div id="grade"></div></div>
  <div id="legenda">
    <span><i class="quad" style="background:#d0d0d0;border:1.5px solid #9ca3af"></i>usado</span>
    <span><i class="quad" style="background:#e9e4f7;border:1.5px solid #c4b5e8"></i>disponível</span>
  </div>
  <div id="pergunta-rotulo">Quanto sobrou?</div>
  <div class="stepper">
    <button id="menos-btn" type="button">−1</button>
    <span id="frac-mostrada">
      <span id="num-mostrado">0</span>
      <span class="barra"></span>
      <span id="den-mostrado">0</span>
    </span>
    <button id="mais-btn" type="button">+1</button>
  </div>
  <button id="confirmar-btn" type="button">Confirmar</button>
  <div id="feedback"></div>
  <button id="proximo-btn">Próxima →</button>
</div>

<script>
(function(){
  // ── Banco de rodadas ──────────────────────────────────────────────────────
  // denom: total de partes iguais. usado: partes já usadas.
  // O aluno deve ajustar o numerador do COMPLEMENTO (partes que sobraram).
  var rodadas = [
    { denom:6,  usado:2 },
    { denom:8,  usado:3 },
    { denom:5,  usado:1 },
    { denom:10, usado:6 },
    { denom:9,  usado:3 },
    { denom:12, usado:5 },
  ];

  var ordemRodadas = [0,1,2,3,4,5];
  for(var i=ordemRodadas.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=ordemRodadas[i];ordemRodadas[i]=ordemRodadas[j];ordemRodadas[j]=t;
  }
  ordemRodadas = ordemRodadas.slice(0,4);

  var rodadaAtual = 0;
  var acertos = 0;
  var valor = 0;
  var respondido = false;
  var respondidoFinal = false;
  var inicio = Date.now();

  var spanNum = document.getElementById('num-mostrado');
  var spanDen = document.getElementById('den-mostrado');
  var btnMenos = document.getElementById('menos-btn');
  var btnMais = document.getElementById('mais-btn');
  var btnConfirmar = document.getElementById('confirmar-btn');
  var fb = document.getElementById('feedback');

  function montaGrade(total, usado){
    var g = document.getElementById('grade');
    g.innerHTML = '';
    var cols = total <= 6 ? total : Math.ceil(total/2);
    g.style.gridTemplateColumns = 'repeat('+cols+', 34px)';
    for(var i=0;i<total;i++){
      var c = document.createElement('div');
      c.className = 'celula ' + (i < usado ? 'usada' : 'livre');
      g.appendChild(c);
    }
  }

  function atualizarStepper(){
    spanNum.textContent = valor;
  }

  function renderRodada(){
    var r = rodadas[ordemRodadas[rodadaAtual]];

    document.getElementById('rodada-info').textContent =
      'Rodada ' + (rodadaAtual+1) + ' de ' + ordemRodadas.length;

    montaGrade(r.denom, r.usado);
    spanDen.textContent = r.denom;
    valor = 0;
    atualizarStepper();

    btnMenos.disabled = false;
    btnMais.disabled = false;
    btnConfirmar.disabled = false;
    fb.textContent = '';
    fb.className = '';
    document.getElementById('proximo-btn').style.display = 'none';
    respondido = false;
  }

  btnMenos.onclick = function(){
    if(respondido) return;
    valor = Math.max(0, valor - 1);
    atualizarStepper();
  };
  btnMais.onclick = function(){
    if(respondido) return;
    var r = rodadas[ordemRodadas[rodadaAtual]];
    valor = Math.min(r.denom, valor + 1);
    atualizarStepper();
  };

  btnConfirmar.onclick = function(){
    if(respondido) return;
    respondido = true;
    btnMenos.disabled = true;
    btnMais.disabled = true;
    btnConfirmar.disabled = true;

    var r = rodadas[ordemRodadas[rodadaAtual]];
    var alvo = r.denom - r.usado;
    var eCorreta = (valor === alvo);

    if(!eCorreta){
      valor = alvo;
      atualizarStepper();
    }

    if(eCorreta){
      acertos++;
      spanNum.parentNode.style.color = '#16a34a';
      fb.textContent = '✓ Correto!';
      fb.className = 'ok';
    } else {
      spanNum.parentNode.style.color = '#dc2626';
      fb.textContent = '✗ Não era esse. A resposta certa era ' + alvo + '/' + r.denom + '.';
      fb.className = 'nok';
    }

    if(rodadaAtual >= ordemRodadas.length - 1){
      setTimeout(function(){
        encerrar();
      }, 1400);
    } else {
      document.getElementById('proximo-btn').style.display = 'block';
    }
  };

  function encerrar(){
    if(respondidoFinal) return;
    respondidoFinal = true;
    var acertouFinal = (acertos === ordemRodadas.length);
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertouFinal,
      meta: {
        tentativas: ordemRodadas.length,
        tempo: Math.round((Date.now()-inicio)/1000),
        resposta: acertos + '/' + ordemRodadas.length + ' acertos'
      }
    }, '*');
  }

  document.getElementById('proximo-btn').onclick = function(){
    rodadaAtual++;
    spanNum.parentNode.style.color = '#1f2937';
    renderRodada();
  };

  renderRodada();
})();
</script>
</body>
</html>
