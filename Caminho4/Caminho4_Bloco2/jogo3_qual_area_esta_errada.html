<!-- ENUNCIADO: Cada retângulo abaixo mostra sua largura, sua altura e a área anotada. Três dessas contas de área estão certas, e uma está errada. Clique no retângulo com a área errada. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:520px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .opcoes{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  button.opcao{ padding:8px; border-radius:10px; border:2px solid #ddd; background:#fff; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ border-color:var(--verde); background:#e9f9ef; }
  button.opcao.errada{ border-color:var(--vermelho); background:#fdecea; }
  button.opcao svg{ width:100%; height:100px; display:block; }
  #fb{ margin-top:12px; min-height:20px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var NAVY = "#14365A";
  function cardIcon(w, h, areaShown){
    var maxw = 100, maxh = 70;
    var scale = Math.min(maxw/w, maxh/h);
    var rw = w*scale, rh = h*scale;
    var x = (140-rw)/2, y = 10;
    var s = '<svg viewBox="0 0 140 110">';
    s += '<rect x="'+x+'" y="'+y+'" width="'+rw+'" height="'+rh+'" fill="#E6F0FA" stroke="'+NAVY+'" stroke-width="2.4" rx="4"/>';
    s += '<text x="70" y="'+(y+rh+18)+'" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="'+NAVY+'" text-anchor="middle">'+w+' x '+h+' = '+areaShown+'</text>';
    s += '</svg>';
    return s;
  }

  // three correct, one wrong (area label doesn't match w*h)
  var CARTOES = {
    a: { w:6, h:5, area:30, correta:false },   // 6x5=30 CORRECT statement (correta:false means "not the exception")
    b: { w:7, h:4, area:26, correta:true },    // 7x4=28, labeled 26 -> WRONG statement, this is the exception
    c: { w:8, h:3, area:24, correta:false },   // 8x3=24 correct
    d: { w:9, h:6, area:54, correta:false }    // 9x6=54 correct
  };
  var ordem = ["c","b","a","d"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = {};

  ordem.forEach(function(chave){
    var c = CARTOES[chave];
    var b = document.createElement("button");
    b.className = "opcao";
    b.innerHTML = cardIcon(c.w, c.h, c.area);
    b.onclick = function(){ escolher(b, chave); };
    opcoesEl.appendChild(b);
    botoes[chave] = b;
  });

  function travarBotoes(){ Object.keys(botoes).forEach(function(k){ botoes[k].disabled = true; }); }
  function revelarCorreta(){
    Object.keys(botoes).forEach(function(k){ if(CARTOES[k].correta) botoes[k].classList.add("certa"); });
  }
  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({ tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta } }, "*");
  }
  function escolher(botao, chave){
    if(respondido) return;
    tentativas++;
    if(CARTOES[chave].correta){
      botao.classList.add("certa"); travarBotoes();
      fb.textContent = "Isso! 7 x 4 = 28, não 26. Essa era a conta errada.";
      fb.className = "ok"; enviar(true, chave);
    } else {
      botao.classList.add("errada"); botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Multiplique a largura pela altura de cada retângulo e compare com o número anotado.";
        fb.className = "no";
      } else {
        travarBotoes(); revelarCorreta();
        fb.textContent = "A conta errada é 7 x 4 = 26: o certo seria 28.";
        fb.className = "no"; enviar(false, chave);
      }
    }
  }
  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes(); revelarCorreta();
    fb.textContent = "Sem problema. A conta errada é 7 x 4 = 26.";
    fb.className = "no"; enviar(false, null);
  };
</script>
</body>
</html>
