<!-- ENUNCIADO: No painel abaixo há figuras de vários formatos. Clique no número que mostra quantas figuras do painel têm exatamente 4 lados. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:520px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .estoque{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
  .estoque svg{ width:100%; height:auto; }
  .opcoes{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button.opcao{ padding:14px 6px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:20px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:20px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="estoque" id="estoque"></div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var NS = "http://www.w3.org/2000/svg";
  function svgIcon(kind, color, fillColor){
    var s = '<svg viewBox="0 0 60 60">';
    if(kind==="tri") s += '<polygon points="30,8 6,50 54,50" fill="'+fillColor+'" stroke="'+color+'" stroke-width="3"/>';
    if(kind==="quad") s += '<rect x="10" y="10" width="40" height="40" rx="4" fill="'+fillColor+'" stroke="'+color+'" stroke-width="3"/>';
    if(kind==="pent"){
      var pts=[]; for(var i=0;i<5;i++){ var a=(-90+i*72)*Math.PI/180; pts.push((30+22*Math.cos(a)).toFixed(1)+","+(30+22*Math.sin(a)).toFixed(1)); }
      s += '<polygon points="'+pts.join(" ")+'" fill="'+fillColor+'" stroke="'+color+'" stroke-width="3"/>';
    }
    if(kind==="circ") s += '<circle cx="30" cy="30" r="22" fill="'+fillColor+'" stroke="'+color+'" stroke-width="3"/>';
    s += '</svg>';
    return s;
  }

  var seq = ["tri","quad","circ","pent","quad","tri","circ","quad","pent","tri","circ","quad"];
  var COLOR = { tri:["#2F80C4","#E6F0FA"], quad:["#E0701B","#FCEBD9"], pent:["#7A5CC0","#EEE8FA"], circ:["#3E9B6B","#E2F2EA"] };
  var estoqueEl = document.getElementById("estoque");
  seq.forEach(function(k){
    var d = document.createElement("div");
    d.innerHTML = svgIcon(k, COLOR[k][0], COLOR[k][1]);
    estoqueEl.appendChild(d);
  });

  var contagem = {tri:0,quad:0,pent:0,circ:0};
  seq.forEach(function(k){ contagem[k]++; });
  var CORRETA = contagem.quad; // 4 lados = quadrados

  var OPCOES = [
    {chave:"a", valor: contagem.tri},
    {chave:"b", valor: CORRETA},
    {chave:"c", valor: contagem.tri + contagem.pent},
    {chave:"d", valor: seq.length}
  ];
  var ordem = ["c","b","a","d"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = {};

  ordem.forEach(function(chave){
    var opc = OPCOES.filter(function(o){ return o.chave===chave; })[0];
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = opc.valor;
    b.onclick = function(){ escolher(b, opc.valor); };
    opcoesEl.appendChild(b);
    botoes[chave] = b;
  });

  function travarBotoes(){
    Object.keys(botoes).forEach(function(k){ botoes[k].disabled = true; });
  }

  function revelarCorreta(){
    Object.keys(botoes).forEach(function(k){
      var opc = OPCOES.filter(function(o){ return o.chave===k; })[0];
      if(opc.valor === CORRETA) botoes[k].classList.add("certa");
    });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! " + CORRETA + " figuras têm 4 lados.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Conte de novo, forma por forma, quantos lados cada uma tem.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é " + CORRETA + ": são os quadrados, a única forma com 4 lados no painel.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é " + CORRETA + ".";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
