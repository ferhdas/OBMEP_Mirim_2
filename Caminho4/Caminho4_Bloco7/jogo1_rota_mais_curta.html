<!-- ENUNCIADO: Duas rotas ligam o início ao fim, cada uma com três trechos marcados. Clique no número de metros que a rota mais longa tem a mais do que a rota mais curta. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:480px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  #rotas{ width:100%; height:auto; margin-bottom:14px; }
  .opcoes{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button.opcao{ padding:14px 6px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:20px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg id="rotas" viewBox="0 0 420 220"></svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var NAVY = "#14365A", BLUE="#2F80C4", ORANGE="#E0701B";
  var A = [22, 30, 18], B = [28, 15, 35];
  var sumA = A.reduce(function(a,b){return a+b;},0);
  var sumB = B.reduce(function(a,b){return a+b;},0);
  var CORRETA = Math.abs(sumA - sumB);

  var html = '<rect width="420" height="220" fill="white"/>';
  html += '<polyline points="40,55 140,55 140,110 220,110" fill="none" stroke="'+BLUE+'" stroke-width="3.2"/>';
  html += '<polyline points="40,75 170,75 170,170 220,110" fill="none" stroke="'+ORANGE+'" stroke-width="3.2"/>';
  html += '<text x="85" y="48" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="'+BLUE+'">'+A[0]+'</text>';
  html += '<text x="150" y="90" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="'+BLUE+'">'+A[1]+'</text>';
  html += '<text x="175" y="112" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="'+BLUE+'">'+A[2]+'</text>';
  html += '<text x="95" y="70" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="'+ORANGE+'">'+B[0]+'</text>';
  html += '<text x="178" y="130" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="'+ORANGE+'">'+B[1]+'</text>';
  html += '<text x="195" y="145" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="'+ORANGE+'">'+B[2]+'</text>';
  html += '<text x="40" y="195" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="'+BLUE+'">Rota A (azul)</text>';
  html += '<text x="40" y="212" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="'+ORANGE+'">Rota B (laranja)</text>';
  document.getElementById("rotas").innerHTML = html;

  var OPCOES = [
    {chave:"a", valor: CORRETA},
    {chave:"b", valor: sumA},
    {chave:"c", valor: sumB},
    {chave:"d", valor: sumA + sumB}
  ];
  var ordem = ["b","d","a","c"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = {};

  ordem.forEach(function(chave){
    var opc = OPCOES.filter(function(o){ return o.chave===chave; })[0];
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = opc.valor;
    b.onclick = function(){ escolher(b, opc.valor); };
    opcoesEl.appendChild(b);
    botoes[chave] = b;
  });

  function travarBotoes(){ Object.keys(botoes).forEach(function(k){ botoes[k].disabled = true; }); }
  function revelarCorreta(){
    Object.keys(botoes).forEach(function(k){
      var opc = OPCOES.filter(function(o){ return o.chave===k; })[0];
      if(opc.valor === CORRETA) botoes[k].classList.add("certa");
    });
  }
  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({ tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta } }, "*");
  }
  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa"); travarBotoes();
      fb.textContent = "Isso! A diferença entre as duas rotas é " + CORRETA + " metros.";
      fb.className = "ok"; enviar(true, valor);
    } else {
      botao.classList.add("errada"); botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Some os trechos de cada rota primeiro, depois compare os dois totais.";
        fb.className = "no";
      } else {
        travarBotoes(); revelarCorreta();
        fb.textContent = "A resposta certa é " + CORRETA + " metros.";
        fb.className = "no"; enviar(false, valor);
      }
    }
  }
  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes(); revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é " + CORRETA + " metros.";
    fb.className = "no"; enviar(false, null);
  };
</script>
</body>
</html>
