<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="220" fill="white"/>
<text x="230" y="20" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">Duas regras separadas</text>
<rect x="30" y="38" width="400" height="36" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="230" y="61" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Regra 1: se múltiplo de 9, então múltiplo de 3</text>
<rect x="30" y="82" width="400" height="36" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="230" y="105" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Regra 2: se múltiplo de 3, então soma dos algarismos é múltiplo de 3</text>
<rect x="30" y="135" width="150" height="40" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/>
<text x="105" y="160" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">45 é múltiplo de 9</text>
<rect x="200" y="135" width="110" height="40" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="2"/>
<text x="255" y="160" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
<rect x="330" y="135" width="110" height="40" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="2"/>
<text x="385" y="160" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
<text x="230" y="205" font-family="DejaVu Sans" font-size="11" fill="#14365A" text-anchor="middle">A soma dos algarismos de 45 é múltiplo de 3?</text>
</svg>
