<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:export-filename="cond_aplicar_estrutura.png" inkscape:export-xdpi="174.5454545" inkscape:export-ydpi="174.5454545">
<rect width="440" height="200" fill="white"/>
<text x="220" y="22" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Uma regra e um caso</text>
<rect x="40" y="45" width="360" height="42" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="220" y="70" font-family="DejaVu Sans" font-size="13" fill="#14365A" text-anchor="middle">Regra: se um número é múltiplo de 4, então ele é par</text>
<rect x="40" y="100" width="170" height="42" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/>
<text x="125" y="126" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">28 é múltiplo de 4</text>
<text x="225" y="126" font-family="DejaVu Sans" font-size="16" fill="#8A97A6" text-anchor="middle">→</text>
<rect x="245" y="100" width="155" height="42" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="2"/>
<text x="322" y="120" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">28 é par?</text>
<text x="322" y="138" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
</svg>
