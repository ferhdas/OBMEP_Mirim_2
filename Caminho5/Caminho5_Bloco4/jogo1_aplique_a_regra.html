<!-- ENUNCIADO: Regra: se um número é múltiplo de 3, então a soma dos seus algarismos é múltiplo de 3. O número 51 é múltiplo de 3. Clique na conclusão correta. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:480px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .pistas{ font-size:12.5px; color:#14365A; margin-bottom:14px; line-height:1.6; }
  .pistas div{ background:#EEF3F8; border:1.6px solid #CBD5DF; border-radius:8px; padding:8px 10px; margin-bottom:6px; }
  .opcoes{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.opcao{ padding:12px 8px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:12.5px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; text-align:left; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:20px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="pistas">
      <div>Regra: se um número é múltiplo de 3, a soma dos algarismos é múltiplo de 3</div>
      <div>51 é múltiplo de 3</div>
    </div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var OPCOES = [
    { chave:"a", texto:"A soma dos algarismos de 51 é múltiplo de 3", certa:true },
    { chave:"b", texto:"51 é par", certa:false },
    { chave:"c", texto:"51 é múltiplo de 5", certa:false },
    { chave:"d", texto:"Nada pode ser concluído", certa:false }
  ];
  var CORRETA = "a";

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = {};

  OPCOES.forEach(function(opc){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = opc.texto;
    b.onclick = function(){ escolher(b, opc.chave); };
    opcoesEl.appendChild(b);
    botoes[opc.chave] = b;
  });

  function travarBotoes(){ Object.keys(botoes).forEach(function(k){ botoes[k].disabled = true; }); }
  function revelarCorreta(){ botoes[CORRETA].classList.add("certa"); }
  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({ tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta } }, "*");
  }
  function escolher(botao, chave){
    if(respondido) return;
    tentativas++;
    if(chave === CORRETA){
      botao.classList.add("certa"); travarBotoes();
      fb.textContent = "Isso! Como 51 é múltiplo de 3, a regra garante que a soma dos seus algarismos também é.";
      fb.className = "ok"; enviar(true, chave);
    } else {
      botao.classList.add("errada"); botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "A regra garante exatamente a consequência dela, nem mais, nem menos.";
        fb.className = "no";
      } else {
        travarBotoes(); revelarCorreta();
        fb.textContent = "A conclusão correta é sobre a soma dos algarismos ser múltiplo de 3.";
        fb.className = "no"; enviar(false, chave);
      }
    }
  }
  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes(); revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa está marcada em verde.";
    fb.className = "no"; enviar(false, null);
  };
</script>
</body>
</html>
