<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="220" fill="white"/>
<text x="230" y="20" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">A cadeia completa</text>
<rect x="30" y="38" width="400" height="36" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="230" y="61" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Regra 1: se múltiplo de 9, então múltiplo de 3</text>
<rect x="30" y="82" width="400" height="36" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="230" y="105" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Regra 2: se múltiplo de 3, então soma dos algarismos é múltiplo de 3</text>
<rect x="20" y="135" width="130" height="40" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/>
<text x="85" y="160" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">45 mult. 9</text>
<line x1="152" y1="155" x2="178" y2="155" stroke="#3E9B6B" stroke-width="2.4"/>
<polygon points="178,155 170,150 170,160" fill="#3E9B6B"/>
<rect x="180" y="135" width="130" height="40" rx="8" fill="#FCEBD9" stroke="#E0701B" stroke-width="2.2"/>
<text x="245" y="160" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">45 mult. 3</text>
<line x1="312" y1="155" x2="338" y2="155" stroke="#3E9B6B" stroke-width="2.4"/>
<polygon points="338,155 330,150 330,160" fill="#3E9B6B"/>
<rect x="340" y="135" width="110" height="40" rx="8" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.2"/>
<text x="395" y="153" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="#14365A" text-anchor="middle">soma alg.</text>
<text x="395" y="167" font-family="DejaVu Sans" font-size="11" font-weight="bold" fill="#14365A" text-anchor="middle">mult. de 3</text>
<text x="230" y="205" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#3E9B6B" text-anchor="middle">4 + 5 = 9, e 9 é múltiplo de 3</text>
</svg>
