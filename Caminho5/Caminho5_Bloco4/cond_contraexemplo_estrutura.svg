<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg">
<rect width="440" height="220" fill="white"/>
<text x="220" y="22" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Afirmação: toda fruta vermelha é uma maçã</text>
<rect x="30" y="50" width="90" height="50" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/>
<text x="75" y="80" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Banana</text>
<rect x="135" y="50" width="90" height="50" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/>
<text x="180" y="80" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Morango</text>
<rect x="240" y="50" width="90" height="50" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/>
<text x="285" y="72" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Uva</text>
<text x="285" y="88" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">verde</text>
<rect x="345" y="50" width="90" height="50" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/>
<text x="390" y="80" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Pera</text>
<text x="220" y="140" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
<text x="220" y="170" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Qual fruta é vermelha e não é maçã?</text>
