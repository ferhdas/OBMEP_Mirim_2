<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="200" fill="white"/>
<text x="230" y="20" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">A 6ª meia obriga uma cor a repetir</text>
<g font-family="DejaVu Sans" font-size="10" fill="#14365A" text-anchor="middle">
<rect x="20" y="40" width="70" height="80" rx="8" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.4"/><text x="55" y="35">cor 1</text><circle cx="45" cy="80" r="13" fill="#2F80C4"/><circle cx="68" cy="80" r="13" fill="#E0701B"/>
<rect x="100" y="40" width="70" height="80" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="135" y="35">cor 2</text><circle cx="135" cy="80" r="14" fill="#2F80C4"/>
<rect x="180" y="40" width="70" height="80" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="215" y="35">cor 3</text><circle cx="215" cy="80" r="14" fill="#2F80C4"/>
<rect x="260" y="40" width="70" height="80" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="295" y="35">cor 4</text><circle cx="295" cy="80" r="14" fill="#2F80C4"/>
<rect x="340" y="40" width="70" height="80" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="375" y="35">cor 5</text><circle cx="375" cy="80" r="14" fill="#2F80C4"/>
</g>
<text x="230" y="160" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#3E9B6B" text-anchor="middle">5 + 1 = 6: a cor 1 (verde) recebeu 2 meias</text>
</svg>
