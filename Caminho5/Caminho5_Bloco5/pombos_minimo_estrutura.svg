<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:export-filename="pombos_minimo_estrutura.png" inkscape:export-xdpi="192" inkscape:export-ydpi="192">
<rect width="400" height="200" fill="white"/>
<text x="200" y="20" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">3 gavetas de cor, 2 bolinhas cada uma</text>
<g font-family="DejaVu Sans" font-size="11" fill="#14365A" text-anchor="middle">
<rect x="30" y="40" width="90" height="90" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="75" y="35">cor 1</text>
<circle cx="58" cy="90" r="13" fill="#2F80C4"/><circle cx="92" cy="90" r="13" fill="#2F80C4"/>
<rect x="150" y="40" width="90" height="90" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="195" y="35">cor 2</text>
<circle cx="178" cy="90" r="13" fill="#2F80C4"/><circle cx="212" cy="90" r="13" fill="#2F80C4"/>
<rect x="270" y="40" width="90" height="90" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="315" y="35">cor 3</text>
<circle cx="298" cy="90" r="13" fill="#2F80C4"/><circle cx="332" cy="90" r="13" fill="#2F80C4"/>
</g>
<text x="200" y="165" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">A 7ª bolinha (laranja) ainda não foi guardada</text>
<circle cx="200" cy="185" r="12" fill="#FCEBD9" stroke="#E0701B" stroke-width="2"/>
<text x="200" y="189" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
</svg>
