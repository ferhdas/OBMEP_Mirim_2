<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="200" fill="white"/>
<text x="230" y="20" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Pessoa 2 (lado A) fica de frente para a pessoa 5 (lado B)</text>
<rect x="30" y="90" width="400" height="20" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<line x1="55" y1="60" x2="335" y2="140" stroke="#3E9B6B" stroke-width="2.4" stroke-dasharray="6,4"/>
<circle cx="55" cy="60" r="16" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.4"/>
<text x="55" y="65" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">2</text>
<circle cx="335" cy="140" r="16" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.4"/>
<text x="335" y="145" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">5</text>
<g font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#14365A" text-anchor="middle">
<circle cx="125" cy="60" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="125" y="65">1</text>
<circle cx="195" cy="60" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="195" y="65">3</text>
<circle cx="265" cy="60" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="265" y="65">4</text>
<circle cx="405" cy="60" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="405" y="65">6</text>
<circle cx="125" cy="140" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="125" y="145">2</text>
<circle cx="195" cy="140" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="195" y="145">3</text>
<circle cx="265" cy="140" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="265" y="145">4</text>
<circle cx="405" cy="140" r="16" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/><text x="405" y="145">6</text>
</g>
<text x="20" y="65" font-family="DejaVu Sans" font-size="10" fill="#8A97A6" text-anchor="middle">A</text>
<text x="20" y="145" font-family="DejaVu Sans" font-size="10" fill="#8A97A6" text-anchor="middle">B</text>
<text x="230" y="180" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#3E9B6B" text-anchor="middle">6 + 1 = 7, e 7 − 2 = 5</text>
</svg>
