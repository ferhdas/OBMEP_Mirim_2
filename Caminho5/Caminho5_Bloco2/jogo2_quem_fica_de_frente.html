<!-- ENUNCIADO: Numa mesa comprida, 7 amigos sentam de um lado, numerados de 1 a 7. Do outro lado, outros 7 sentam de frente para eles, também numerados de 1 a 7. Clique em quem fica de frente para a pessoa 3 do lado A. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:480px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  #mesa{ width:100%; height:auto; margin-bottom:10px; }
  .opcoes{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button.opcao{ padding:10px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:15px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:20px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg id="mesa" viewBox="0 0 460 150"></svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var NAVY = "#14365A", BLUE = "#2F80C4", ORANGE = "#E0701B", FILL = "#E6F0FA";
  var N = 7, K = 3;
  var CORRETA = N + 1 - K;

  var xs = [40, 100, 160, 220, 280, 340, 400];
  var html = '<rect width="460" height="150" fill="white"/>';
  html += '<rect x="20" y="65" width="420" height="18" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.4"/>';
  for (var i = 1; i <= N; i++) {
    var x = xs[i-1];
    var fillTop = (i === K) ? "#FCEBD9" : FILL;
    var strokeTop = (i === K) ? ORANGE : BLUE;
    html += '<circle cx="'+x+'" cy="40" r="15" fill="'+fillTop+'" stroke="'+strokeTop+'" stroke-width="2.2"/>';
    html += '<text x="'+x+'" y="45" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="'+NAVY+'" text-anchor="middle">'+i+'</text>';
    html += '<circle cx="'+x+'" cy="112" r="15" fill="'+FILL+'" stroke="'+BLUE+'" stroke-width="2.2"/>';
    html += '<text x="'+x+'" y="117" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="'+NAVY+'" text-anchor="middle">'+i+'</text>';
  }
  html += '<text x="10" y="45" font-family="DejaVu Sans" font-size="9" fill="#8A97A6" text-anchor="middle">A</text>';
  html += '<text x="10" y="117" font-family="DejaVu Sans" font-size="9" fill="#8A97A6" text-anchor="middle">B</text>';
  document.getElementById("mesa").innerHTML = html;

  var OPCOES = [CORRETA, K, N, 1].filter(function(v,i,a){ return a.indexOf(v) === i; });
  while (OPCOES.length < 4) { var extra = N - OPCOES.length; if (OPCOES.indexOf(extra) === -1 && extra >= 1) OPCOES.push(extra); else break; }
  var ordem = [OPCOES[1], OPCOES[3] || OPCOES[0], OPCOES[0], OPCOES[2]].filter(function(v){ return v !== undefined; });
  ordem = Array.from(new Set(ordem));

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = {};

  ordem.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes[valor] = b;
  });

  function travarBotoes(){ Object.keys(botoes).forEach(function(k){ botoes[k].disabled = true; }); }
  function revelarCorreta(){ botoes[CORRETA].classList.add("certa"); }
  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({ tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta } }, "*");
  }
  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa"); travarBotoes();
      fb.textContent = "Isso! " + N + " + 1 = " + (N+1) + ", e " + (N+1) + " − " + K + " = " + CORRETA + ".";
      fb.className = "ok"; enviar(true, valor);
    } else {
      botao.classList.add("errada"); botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Some 1 ao total de cada lado e subtraia a posição dada.";
        fb.className = "no";
      } else {
        travarBotoes(); revelarCorreta();
        fb.textContent = "Quem fica de frente é a pessoa " + CORRETA + " do lado B.";
        fb.className = "no"; enviar(false, valor);
      }
    }
  }
  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes(); revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa está marcada em verde.";
    fb.className = "no"; enviar(false, null);
  };
</script>
</body>
</html>
