<text x="240" y="160" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Cada seta liga quem é mais rápido a quem é mais lento</text>
<text x="240" y="185" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#3E9B6B" text-anchor="middle">Rita, Marcos, Júlia, Pedro</text>
