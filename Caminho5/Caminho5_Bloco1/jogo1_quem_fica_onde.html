<!-- ENUNCIADO: Quatro amigos esperam numa fila. Caio está na frente de todos. Beto está logo atrás de Caio. Duda não está no fim da fila. Clique em quem fica na 3ª posição da fila. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:480px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  #fila{ width:100%; height:auto; margin-bottom:14px; }
  .pistas{ font-size:12.5px; color:#14365A; margin-bottom:12px; line-height:1.5; }
  .opcoes{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:15px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:20px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg id="fila" viewBox="0 0 420 140"></svg>
    <div class="pistas">Pistas: Caio está na frente de todos. Beto está logo atrás de Caio. Duda não está no fim da fila.</div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var NAVY = "#14365A", BLUE = "#2F80C4", GREY = "#EEF3F8", BORDER = "#CBD5DF";
  var CORRETA_NOME = "Duda";

  var html = '<rect width="420" height="140" fill="white"/>';
  var nomes = ["?", "?", "?", "?"];
  var xs = [15, 115, 215, 315];
  for (var i = 0; i < 4; i++) {
    html += '<rect x="'+xs[i]+'" y="20" width="90" height="70" rx="10" fill="'+GREY+'" stroke="'+BORDER+'" stroke-width="2"/>';
    html += '<text x="'+(xs[i]+45)+'" y="14" font-family="DejaVu Sans" font-size="10" fill="'+NAVY+'" text-anchor="middle">'+(i+1)+'</text>';
    html += '<text x="'+(xs[i]+45)+'" y="60" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="'+BLUE+'" text-anchor="middle">?</text>';
  }
  html += '<text x="210" y="128" font-family="DejaVu Sans" font-size="12" fill="'+NAVY+'" text-anchor="middle">Onde fica cada amigo?</text>';
  document.getElementById("fila").innerHTML = html;

  var OPCOES = ["Ana", "Beto", "Caio", "Duda"];
  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = {};

  OPCOES.forEach(function(nome){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = nome;
    b.onclick = function(){ escolher(b, nome); };
    opcoesEl.appendChild(b);
    botoes[nome] = b;
  });

  function travarBotoes(){ Object.keys(botoes).forEach(function(k){ botoes[k].disabled = true; }); }
  function revelarCorreta(){ botoes[CORRETA_NOME].classList.add("certa"); }
  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({ tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta } }, "*");
  }
  function escolher(botao, nome){
    if(respondido) return;
    tentativas++;
    if(nome === CORRETA_NOME){
      botao.classList.add("certa"); travarBotoes();
      fb.textContent = "Isso! Caio é o 1º, Beto é o 2º, e Duda não pode ser o 4º, então ele é o 3º.";
      fb.className = "ok"; enviar(true, nome);
    } else {
      botao.classList.add("errada"); botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Primeiro fixe Caio e Beto nas duas primeiras posições, depois use a pista sobre Duda.";
        fb.className = "no";
      } else {
        travarBotoes(); revelarCorreta();
        fb.textContent = "Quem fica na 3ª posição é Duda.";
        fb.className = "no"; enviar(false, nome);
      }
    }
  }
  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes(); revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa está marcada em verde.";
    fb.className = "no"; enviar(false, null);
  };
</script>
</body>
</html>
