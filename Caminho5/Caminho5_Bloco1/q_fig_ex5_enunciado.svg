<text x="230" y="110" font-family="DejaVu Sans" font-size="13" fill="#14365A" text-anchor="middle">A caixa Y pesa mais que a caixa Z</text>
<rect x="20" y="132" width="420" height="38" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="230" y="156" font-family="DejaVu Sans" font-size="13" fill="#14365A" text-anchor="middle">A caixa W pesa mais que a caixa X</text>
