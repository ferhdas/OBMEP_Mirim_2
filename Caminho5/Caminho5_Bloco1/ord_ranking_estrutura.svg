<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg">
<rect width="480" height="240" fill="white"/>
<text x="240" y="22" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Três comparações soltas entre corredores</text>
<rect x="30" y="45" width="420" height="46" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="240" y="73" font-family="DejaVu Sans" font-size="14" fill="#14365A" text-anchor="middle">Marcos corre mais rápido que Júlia</text>
<rect x="30" y="100" width="420" height="46" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="240" y="128" font-family="DejaVu Sans" font-size="14" fill="#14365A" text-anchor="middle">Júlia corre mais rápido que Pedro</text>
<rect x="30" y="155" width="420" height="46" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.6"/>
<text x="240" y="183" font-family="DejaVu Sans" font-size="14" fill="#14365A" text-anchor="middle">Rita corre mais rápido que Marcos</text>
<text x="240" y="222" font-family="DejaVu Sans" font-size="12" fill="#E0701B" text-anchor="middle">Júlia e Marcos aparecem em duas pistas cada um</text>
</svg>
