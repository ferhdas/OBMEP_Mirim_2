<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 460 220" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="220" fill="white"/>
<text x="230" y="22" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#3E9B6B" text-anchor="middle">Senha descoberta: 6 - 5 - 3</text>
<g font-family="DejaVu Sans" font-size="11" fill="#14365A" text-anchor="middle">
<text x="85" y="42">centena</text>
<text x="230" y="42">dezena</text>
<text x="375" y="42">unidade</text>
</g>
<rect x="35" y="50" width="100" height="90" rx="10" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.6"/>
<text x="85" y="105" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#3E9B6B" text-anchor="middle">6</text>
<rect x="180" y="50" width="100" height="90" rx="10" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/>
<text x="230" y="105" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#2F80C4" text-anchor="middle">5</text>
<rect x="325" y="50" width="100" height="90" rx="10" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.6"/>
<text x="375" y="105" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#3E9B6B" text-anchor="middle">3</text>
<g font-family="DejaVu Sans" font-size="13" fill="#14365A" text-anchor="middle">
<text x="230" y="172">6 + 5 + 3 = 14</text>
<text x="230" y="194">6 = 2 &#215; 3</text>
</g>
