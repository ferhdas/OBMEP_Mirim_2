<text x="105" y="65" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#14365A" text-anchor="middle">Beto</text>
<text x="200" y="65" font-family="DejaVu Sans" font-size="16" fill="#8A97A6" text-anchor="middle">→</text>
<rect x="230" y="40" width="130" height="40" rx="8" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2"/>
<text x="295" y="65" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#14365A" text-anchor="middle">cachorro</text>
<rect x="40" y="90" width="130" height="40" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="2"/>
<text x="105" y="115" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#14365A" text-anchor="middle">Ana</text>
<text x="200" y="115" font-family="DejaVu Sans" font-size="16" fill="#8A97A6" text-anchor="middle">→</text>
