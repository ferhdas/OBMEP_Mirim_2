<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:export-filename="assoc_grade_estrutura.png" inkscape:export-xdpi="192" inkscape:export-ydpi="192">
<rect width="400" height="220" fill="white"/>
<text x="200" y="20" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Três amigos, três bichos de estimação</text>
