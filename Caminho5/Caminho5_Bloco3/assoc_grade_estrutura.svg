<text x="200" y="165" font-family="DejaVu Sans" font-size="16" fill="#8A97A6" text-anchor="middle">→</text>
<rect x="230" y="140" width="130" height="40" rx="8" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="2"/>
<text x="295" y="168" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
<text x="200" y="205" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Pista: Ana não tem gato</text>
