<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="260" fill="white"/>
<text x="200" y="20" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#14365A" text-anchor="middle">Quatro amigos, quatro sobremesas</text>
<g font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle">
<rect x="40" y="36" width="130" height="34" rx="7" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/><text x="105" y="58" fill="#14365A">Mateus</text>
<rect x="230" y="36" width="130" height="34" rx="7" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/><text x="295" y="58" fill="#14365A">sorvete</text>
<rect x="40" y="78" width="130" height="34" rx="7" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/><text x="105" y="100" fill="#14365A">Otávio</text>
<rect x="230" y="78" width="130" height="34" rx="7" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/><text x="295" y="100" fill="#14365A">gelatina</text>
<rect x="40" y="120" width="130" height="34" rx="7" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/><text x="105" y="142" fill="#14365A">Léa</text>
<rect x="230" y="120" width="130" height="34" rx="7" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/><text x="295" y="144" fill="#E0701B" font-size="17">?</text>
<rect x="40" y="162" width="130" height="34" rx="7" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/><text x="105" y="184" fill="#14365A">Nina</text>
<rect x="230" y="162" width="130" height="34" rx="7" fill="#EEF3F8" stroke="#CBD5DF" stroke-width="1.8"/><text x="295" y="186" fill="#E0701B" font-size="17">?</text>
</g>
<text x="200" y="220" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Restam: pudim e bolo</text>
<text x="200" y="240" font-family="DejaVu Sans" font-size="12" fill="#14365A" text-anchor="middle">Pista: quem comeu bolo não foi a Nina</text>
</svg>
