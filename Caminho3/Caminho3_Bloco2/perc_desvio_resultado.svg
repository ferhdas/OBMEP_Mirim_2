<svg viewBox="0 0 700.0 290.0" xmlns="http://www.w3.org/2000/svg"><rect width="700.0" height="290.0" fill="white"/><text x="350.0" y="32.0" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#14365A" text-anchor="middle">O desvio tem 10 km a mais</text><rect x="90.0" y="60.0" width="230.0" height="74.0" rx="12" fill="#FCEBD9" stroke="#E0701B" stroke-width="2.2"/><text x="205.0" y="87.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#8A97A6" text-anchor="middle">desvio (soma dos trechos)</text><text x="205.0" y="116.0" font-family="DejaVu Sans Mono" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">12+18+15 = 45</text><rect x="380.0" y="60.0" width="230.0" height="74.0" rx="12" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.2"/><text x="495.0" y="87.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#8A97A6" text-anchor="middle">trecho reto</text><text x="495.0" y="116.0" font-family="DejaVu Sans Mono" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">35 km</text><text x="350.0" y="103.0" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#14365A" text-anchor="middle">-</text><line x1="350.0" y1="150.0" x2="350.0" y2="181.0" stroke="#3E9B6B" stroke-width="2.6"/><polygon points="350.0,190.0 355.5,181.0 344.5,181.0" fill="#3E9B6B"/><rect x="210.0" y="196.0" width="280.0" height="62.0" rx="12" fill="#FCEFC2" stroke="#F6C445" stroke-width="2.4"/><text x="350.0" y="223.0" font-family="DejaVu Sans Mono" font-size="20" font-weight="bold" fill="#8a6d1a" text-anchor="middle">45 - 35 = 10</text><text x="350.0" y="246.0" font-family="DejaVu Sans" font-size="13" font-weight="normal" fill="#8a6d1a" text-anchor="middle">o desvio tem 10 km a mais</text></svg>