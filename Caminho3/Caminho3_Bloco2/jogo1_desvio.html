<!--
ENUNCIADO
A trilha reta até o mirante tem 26 km. Uma árvore caiu na trilha, e o
desvio passa por três trechos de mata, de 8 km, 15 km e 10 km. Quantos
quilômetros a mais tem o desvio, comparado com a trilha reta? Clique na
resposta certa.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .dado{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .linha{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}
  .chip{border-radius:10px;padding:10px 14px;text-align:center;min-width:64px;}
  .chip .rot{font-size:11px;color:#6b7280;}
  .chip .val{font-family:"Courier New",monospace;font-size:17px;font-weight:700;}
  .reto{background:#e6f0fa;border:2px solid #2F80C4;}
  .reto .val{color:#14365A;}
  .desvio{background:#fcebd9;border:2px solid #E0701B;}
  .desvio .val{color:#c2410c;}
  .sinal{font-weight:800;font-size:18px;color:#14365A;}
  .opcoes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  button.opcao{padding:12px 4px;font-size:15px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;font-weight:700;
               font-family:"Courier New",monospace;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="dado">
    <div class="linha">
      <div class="chip reto"><div class="rot">trilha reta</div><div class="val">26 km</div></div>
    </div>
    <div class="linha">
      <div class="chip desvio"><div class="rot">desvio</div><div class="val">8 km</div></div>
      <span class="sinal">+</span>
      <div class="chip desvio"><div class="val">15 km</div></div>
      <span class="sinal">+</span>
      <div class="chip desvio"><div class="val">10 km</div></div>
    </div>
  </div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var OPCOES = ['33', '59', '18', '7', '8'];
  var CORRETO = '7';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  OPCOES.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = o;
    b.dataset.valor = o;
    b.onclick = function(){ escolher(b, o); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! Some o desvio inteiro e depois subtraia a trilha reta.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Some os três trechos do desvio antes de comparar.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era ' + CORRETO + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
