<!--
ENUNCIADO
Duas caixas de brinquedo iguais, empilhadas as duas deitadas, medem 12 cm
de altura. As mesmas duas caixas, empilhadas com uma deitada e uma em pé,
medem 17 cm. Quanto vão medir as duas caixas empilhadas em pé? Clique na
resposta certa.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .dado{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:10px;padding:6px;margin-bottom:16px;}
  .dado svg{display:block;width:100%;height:auto;}
  .opcoes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  button.opcao{padding:12px 4px;font-size:15px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;font-weight:700;
               font-family:"Courier New",monospace;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="dado">
    <svg viewBox="0 0 440 224" xmlns="http://www.w3.org/2000/svg">
      <rect width="440" height="224" fill="white"/>
      <line x1="20" y1="176" x2="420" y2="176" stroke="#CBD5DF" stroke-width="2"/>
      <rect x="38.0" y="154.0" width="74.0" height="22.0" rx="6" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/>
      <rect x="38.0" y="132.0" width="74.0" height="22.0" rx="6" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/>
      <text x="75.0" y="192.0" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#8A97A6" text-anchor="middle">deitada+deitada</text>
      <rect x="43.0" y="100.0" width="64.0" height="24.0" rx="6" fill="#FCEFC2" stroke="#F6C445" stroke-width="1.8"/>
      <text x="75.0" y="117.0" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8a6d1a" text-anchor="middle">12 cm</text>
      <rect x="183.0" y="154.0" width="74.0" height="22.0" rx="6" fill="#E6F0FA" stroke="#2F80C4" stroke-width="1.8"/>
      <rect x="202.0" y="112.0" width="36.0" height="42.0" rx="6" fill="#EEE8FA" stroke="#7A5CC0" stroke-width="1.8"/>
      <text x="220.0" y="192.0" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#8A97A6" text-anchor="middle">deitada+em pé</text>
      <rect x="188.0" y="80.0" width="64.0" height="24.0" rx="6" fill="#FCEFC2" stroke="#F6C445" stroke-width="1.8"/>
      <text x="220.0" y="97.0" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#8a6d1a" text-anchor="middle">17 cm</text>
      <rect x="347.0" y="134.0" width="36.0" height="42.0" rx="6" fill="#EEE8FA" stroke="#7A5CC0" stroke-width="1.8"/>
      <rect x="347.0" y="92.0" width="36.0" height="42.0" rx="6" fill="#EEE8FA" stroke="#7A5CC0" stroke-width="1.8"/>
      <text x="365.0" y="192.0" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#8A97A6" text-anchor="middle">em pé+em pé</text>
      <rect x="333.0" y="58.0" width="64.0" height="26.0" rx="6" fill="#FCEBD9" stroke="#E0701B" stroke-width="1.8"/>
      <text x="365.0" y="76.0" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">?</text>
    </svg>
  </div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var OPCOES = ['17', '29', '22', '12', '27'];
  var CORRETO = '22';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  OPCOES.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = o;
    b.dataset.valor = o;
    b.onclick = function(){ escolher(b, o); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! O passo entre as alturas é sempre o mesmo, 5 cm.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Ache o passo entre as duas alturas conhecidas e repita.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era ' + CORRETO + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
