<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="260" fill="white"/><text x="280" y="30" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">Troco de R$ 0,65 em 3 moedas</text><text x="280" y="58" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" fill="#14365A" text-anchor="middle">2,00 − 1,35 = 0,65</text><circle cx="170" cy="140" r="40" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.4"/><text x="170" y="146" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">50c</text><circle cx="280" cy="140" r="40" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.4"/><text x="280" y="146" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">10c</text><circle cx="390" cy="140" r="40" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2.4"/><text x="390" y="146" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">5c</text><text x="280" y="200" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#3E9B6B" text-anchor="middle">50 + 10 + 5 = 65 centavos</text><polyline points="269,232 276.3,239.7 291,223.2" fill="none" stroke="#3E9B6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>