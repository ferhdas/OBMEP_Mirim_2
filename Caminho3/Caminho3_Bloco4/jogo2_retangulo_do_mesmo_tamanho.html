<!--
ENUNCIADO
A figura ao lado foi recortada numa folha quadriculada. Entre os retângulos
das opções, clique no que tem a mesma área da figura.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:460px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .figura{display:flex;justify-content:center;background:#f7f9fb;border:2px solid #CBD5DF;
          border-radius:10px;padding:10px;margin-bottom:16px;}
  .opcoes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  button.opcao{padding:12px 4px;font-size:15px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;font-weight:700;
               font-family:"Courier New",monospace;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="figura">
    <svg viewBox="0 0 300 260" width="240" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#CBD5DF" stroke-width="1" fill="white">
        <rect x="25" y="15" width="50" height="50"/><rect x="75" y="15" width="50" height="50"/><rect x="125" y="15" width="50" height="50"/><rect x="175" y="15" width="50" height="50"/><rect x="225" y="15" width="50" height="50"/>
        <rect x="25" y="65" width="50" height="50"/><rect x="75" y="65" width="50" height="50"/><rect x="125" y="65" width="50" height="50"/><rect x="175" y="65" width="50" height="50"/><rect x="225" y="65" width="50" height="50"/>
        <rect x="25" y="115" width="50" height="50"/><rect x="75" y="115" width="50" height="50"/><rect x="125" y="115" width="50" height="50"/><rect x="175" y="115" width="50" height="50"/><rect x="225" y="115" width="50" height="50"/>
        <rect x="25" y="165" width="50" height="50"/><rect x="75" y="165" width="50" height="50"/><rect x="125" y="165" width="50" height="50"/><rect x="175" y="165" width="50" height="50"/><rect x="225" y="165" width="50" height="50"/>
      </g>
      <!-- figura: linha0 cols1,2,3(3) / linha1 cols0,1,2,3,4(5) / linha2 cols0,1,2,3(4) / linha3 cols2,3(2) = 14 -->
      <g fill="#EEE8FA" stroke="#7A5CC0" stroke-width="2.2">
        <rect x="75" y="15" width="50" height="50"/><rect x="125" y="15" width="50" height="50"/><rect x="175" y="15" width="50" height="50"/>
        <rect x="25" y="65" width="50" height="50"/><rect x="75" y="65" width="50" height="50"/><rect x="125" y="65" width="50" height="50"/><rect x="175" y="65" width="50" height="50"/><rect x="225" y="65" width="50" height="50"/>
        <rect x="25" y="115" width="50" height="50"/><rect x="75" y="115" width="50" height="50"/><rect x="125" y="115" width="50" height="50"/><rect x="175" y="115" width="50" height="50"/>
        <rect x="125" y="165" width="50" height="50"/><rect x="175" y="165" width="50" height="50"/>
      </g>
    </svg>
  </div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var OPCOES = ['3 x 5','2 x 7','4 x 4','3 x 4','4 x 5'];
  var CORRETO = '2 x 7';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  OPCOES.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = o;
    b.dataset.valor = o;
    b.onclick = function(){ escolher(b, o); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! 2 x 7 = 14, a mesma área da figura.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Conte os quadradinhos da figura e multiplique linhas por colunas de cada retângulo.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era ' + CORRETO + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
