<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="380" fill="white"/><text x="320.0" y="28.0" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#14365A" text-anchor="middle">Depois de dobrado, a mesma seta aponta na diagonal, não mais para o lado</text><polygon points="246.9,143.0 330.0,191.0 330.0,287.0 246.9,239.0" fill="#FCEFC2" stroke="#14365A" stroke-width="1.6"/><polygon points="413.1,143.0 330.0,191.0 330.0,287.0 413.1,239.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.6"/><polygon points="330.0,95.0 413.1,143.0 330.0,191.0 246.9,143.0" fill="#E6F0FA" stroke="#14365A" stroke-width="1.6"/><line x1="288.4" y1="215.0" x2="322.2" y2="234.5" stroke="#E0701B" stroke-width="3.2"/><polygon points="330.0,239.0 324.7,230.2 319.7,238.8" fill="#E0701B"/><text x="330.0" y="327.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#8A97A6" text-anchor="middle">a face amarela é a mesma da planificação</text><text x="330.0" y="345.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" fill="#8A97A6" text-anchor="middle">a seta virou porque a face inteira girou ao dobrar</text></svg>
