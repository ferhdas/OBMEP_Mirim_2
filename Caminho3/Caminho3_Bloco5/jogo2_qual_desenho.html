<!--
ENUNCIADO
O molde abaixo, com um desenho em cada face, vai virar o cubo mostrado ao lado.
Clique no desenho que fica na face marcada com "?".
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .linha{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
         background:#eef3f8;border:2px solid #2F80C4;border-radius:10px;padding:14px;margin-bottom:8px;}
  .rot{text-align:center;font-size:12px;color:#6b7280;margin-bottom:14px;}
  .opcoes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  button.opcao{padding:6px;border-radius:10px;border:2px solid #d1d5db;background:#fff;
               cursor:pointer;transition:all .2s ease;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{border-color:var(--verde);background:#f0fdf4;}
  button.opcao.errada{border-color:var(--vermelho);background:#fef2f2;}
  button.opcao:disabled{cursor:default;opacity:.9;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="linha">
    <div id="molde"></div>
    <div id="cubo"></div>
  </div>
  <div class="rot">molde (esquerda) e cubo montado com "?" na face que falta (direita)</div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var NAVY="#14365A", ORANGE="#E0701B", BG="#F5F7FA";

  function svgTag(w,h,inner){
    return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" xmlns="http://www.w3.org/2000/svg">'+
           '<rect width="'+w+'" height="'+h+'" fill="white"/>'+inner+'</svg>';
  }
  function rect(x,y,w,h,fill,stroke){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="'+fill+'" stroke="'+(stroke||NAVY)+'" stroke-width="2"/>';
  }
  function text(x,y,t,fs,fill,anchor,weight){
    return '<text x="'+x+'" y="'+y+'" font-family="sans-serif" font-size="'+fs+'" font-weight="'+(weight||'normal')+
           '" fill="'+fill+'" text-anchor="'+(anchor||'middle')+'">'+t+'</text>';
  }
  function poly(pts,fill){
    var p = pts.map(function(pt){return pt[0].toFixed(1)+','+pt[1].toFixed(1);}).join(' ');
    return '<polygon points="'+p+'" fill="'+fill+'"/>';
  }
  var ICONS = {
    estrela: function(cx,cy,r,c){
      var pts=[];
      for (var i=0;i<10;i++){
        var ang=-Math.PI/2+i*Math.PI/5, rr=(i%2===0)?r:r*0.42;
        pts.push([cx+rr*Math.cos(ang), cy+rr*Math.sin(ang)]);
      }
      return poly(pts,c);
    },
    triangulo: function(cx,cy,r,c){
      return poly([[cx,cy-r],[cx-r*0.95,cy+r*0.8],[cx+r*0.95,cy+r*0.8]], c);
    },
    circulo: function(cx,cy,r,c){
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'"/>';
    },
    coracao: function(cx,cy,r,c){
      var d = 'M '+cx+','+(cy+r*0.75)+' C '+(cx-r*1.3)+','+(cy-r*0.35)+' '+(cx-r*0.55)+','+(cy-r*1.15)+' '+cx+','+(cy-r*0.35)+
              ' C '+(cx+r*0.55)+','+(cy-r*1.15)+' '+(cx+r*1.3)+','+(cy-r*0.35)+' '+cx+','+(cy+r*0.75)+' Z';
      return '<path d="'+d+'" fill="'+c+'"/>';
    },
    lua: function(cx,cy,r,c){
      return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'"/>'+
             '<circle cx="'+(cx+r*0.55)+'" cy="'+(cy-r*0.15)+'" r="'+(r*0.82)+'" fill="'+BG+'"/>';
    },
    sol: function(cx,cy,r,c){
      var s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.6)+'" fill="'+c+'"/>';
      for (var i=0;i<8;i++){
        var a=i*Math.PI/4;
        var x1=cx+r*0.75*Math.cos(a), y1=cy+r*0.75*Math.sin(a);
        var x2=cx+r*1.15*Math.cos(a), y2=cy+r*1.15*Math.sin(a);
        s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="2.4"/>';
      }
      return s;
    }
  };

  // molde em cruz B: topo=(1,0) SOL, (1,1) esq-slot LUA, (0,2) dir-slot ESTRELA,
  // (1,2) back_topo CORACAO, (2,2) back_dir TRIANGULO, (1,3) back_esq CIRCULO
  var cellsNet = [[1,0,'sol'],[1,1,'lua'],[0,2,'estrela'],[1,2,'coracao'],[2,2,'triangulo'],[1,3,'circulo']];
  function drawNet(cell){
    cell = cell || 50;
    var s = '';
    for (var i=0;i<cellsNet.length;i++){
      var c=cellsNet[i][0], r=cellsNet[i][1], ic=cellsNet[i][2];
      s += rect(c*cell, r*cell, cell-4, cell-4, 'white');
      s += ICONS[ic](c*cell+cell/2-2, r*cell+cell/2-2, cell*0.28, NAVY);
    }
    return svgTag(3*cell, 4*cell, s);
  }
  function cuboComInterrogacao(s, iconTopo, iconDir){
    var cx = s*0.95, cy = s*0.15;
    var dx = s*0.866, dy = s*0.5;
    var T=[cx,cy], R=[cx+dx,cy+dy], B=[cx,cy+2*dy], L=[cx-dx,cy+dy];
    var R2=[R[0],R[1]+s], B2=[B[0],B[1]+s], L2=[L[0],L[1]+s];
    function facepoly(pts, fill){
      var p = pts.map(function(pt){return pt[0].toFixed(1)+','+pt[1].toFixed(1);}).join(' ');
      return '<polygon points="'+p+'" fill="'+fill+'" stroke="'+NAVY+'" stroke-width="1.6"/>';
    }
    var out = facepoly([L,B,B2,L2], '#EEF3F8') + facepoly([R,B,B2,R2], '#EEF3F8') + facepoly([T,R,B,L], '#EEF3F8');
    var ct = [(T[0]+R[0]+B[0]+L[0])/4, (T[1]+R[1]+B[1]+L[1])/4];
    var cd = [(R[0]+B[0]+B2[0]+R2[0])/4, (R[1]+B[1]+B2[1]+R2[1])/4];
    var ce = [(L[0]+B[0]+B2[0]+L2[0])/4, (L[1]+B[1]+B2[1]+L2[1])/4];
    out += ICONS[iconTopo](ct[0],ct[1], s*0.17, NAVY);
    out += ICONS[iconDir](cd[0],cd[1], s*0.17, NAVY);
    out += text(ce[0], ce[1]+10, '?', 30, ORANGE, 'middle', 'bold');
    return svgTag(s*2, s*2.2, out);
  }

  document.getElementById('molde').innerHTML = drawNet();
  document.getElementById('cubo').innerHTML = cuboComInterrogacao(70, 'sol', 'estrela');

  // resposta certa: face esquerda do cubo = mesma face que, no molde, é o (1,1) = 'lua'
  var CORRETA = 'lua';
  var OPCOES = ['circulo','coracao','sol','lua','triangulo'];

  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');
  var respondido = false, tentativas = 0, inicio = Date.now();

  OPCOES.forEach(function(ic){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.innerHTML = svgTag(44,44, ICONS[ic](22,22,15,NAVY));
    b.dataset.valor = ic;
    b.onclick = function(){ escolher(b, ic); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }
  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETA) btn.classList.add('certa');
    });
  }
  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }
  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETA);
    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! Esse é o desenho certo.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }
    botao.classList.add('errada');
    botao.disabled = true;
    if (tentativas < 2){
      msg.textContent = 'Ainda não. Ache essa mesma face no molde plano.';
      msg.style.color = '#dc2626';
      return;
    }
    travarBotoes();
    revelarCorreta();
    msg.textContent = 'O desenho certo é a lua.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
