<!--
ENUNCIADO
Um cubo de madeira foi pintado de vermelho por fora e depois cortado em 27
cubinhos iguais (3 cubinhos por aresta), como mostra o desenho. Clique no
número certo de cubinhos que ficaram com EXATAMENTE 1 face pintada de
vermelho.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:460px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .dado{display:flex;justify-content:center;align-items:center;
        background:#fcebe6;border:2px solid #C0392B;border-radius:10px;
        padding:10px;margin-bottom:8px;}
  .dado svg{display:block;}
  .legenda{text-align:center;font-size:12px;color:#6b7280;margin-bottom:16px;}
  .opcoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  button.opcao{padding:14px 4px;font-size:19px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;font-weight:700;
               font-family:"Courier New",monospace;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>

  <div class="legenda">cubo de 3 cubinhos por aresta, pintado de vermelho por fora</div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var OPCOES = ['9', '6', '12', '8'];
  var CORRETO = '6';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  OPCOES.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = o;
    b.dataset.valor = o;
    b.onclick = function(){ escolher(b, o); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! São os cubinhos bem no meio de cada face.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Pense em canto (3), aresta (2), face (1) e centro (0).';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era ' + CORRETO + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
