<!--
ENUNCIADO
Três peças foram montadas com 6 cubinhos colados cada uma, em formatos
diferentes. Clique na peça que tem mais pontos de cola (mais faces internas
em contato entre os cubinhos que a formam).
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .aviso{text-align:center;font-size:13px;color:#6b7280;margin-bottom:14px;}
  .opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  button.opcao{padding:8px 4px 10px;border-radius:10px;border:2px solid #d1d5db;
               background:#f7f7f5;cursor:pointer;transition:all .2s ease;
               display:flex;flex-direction:column;align-items:center;gap:4px;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao .rotulo{font-weight:700;font-size:14px;color:#1f2937;}
  button.opcao.certa{background:#dcfce7;border-color:var(--verde);}
  button.opcao.errada{background:#fee2e2;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.9;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="aviso">as três peças têm 6 cubinhos cada uma, colados em formatos diferentes</div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>

(function(){

    B: '<svg viewBox="0 0 200 180" width="150" height="135" xmlns="http://www.w3.org/2000/svg"><polygon points="91.3,65.0 108.7,75.0 108.7,95.0 91.3,85.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="126.0,65.0 108.7,75.0 108.7,95.0 126.0,85.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,55.0 126.0,65.0 108.7,75.0 91.3,65.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="74.0,75.0 91.3,85.0 91.3,105.0 74.0,95.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,75.0 91.3,85.0 91.3,105.0 108.7,95.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,65.0 108.7,75.0 91.3,85.0 74.0,75.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,75.0 126.0,85.0 126.0,105.0 108.7,95.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="143.3,75.0 126.0,85.0 126.0,105.0 143.3,95.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="126.0,65.0 143.3,75.0 126.0,85.0 108.7,75.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="56.7,85.0 74.0,95.0 74.0,115.0 56.7,105.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,85.0 74.0,95.0 74.0,115.0 91.3,105.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="74.0,75.0 91.3,85.0 74.0,95.0 56.7,85.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,85.0 108.7,95.0 108.7,115.0 91.3,105.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="126.0,85.0 108.7,95.0 108.7,115.0 126.0,105.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,75.0 126.0,85.0 108.7,95.0 91.3,85.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="74.0,95.0 91.3,105.0 91.3,125.0 74.0,115.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,95.0 91.3,105.0 91.3,125.0 108.7,115.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,85.0 108.7,95.0 91.3,105.0 74.0,95.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/></svg>',
    C: '<svg viewBox="0 0 200 180" width="150" height="135" xmlns="http://www.w3.org/2000/svg"><polygon points="56.7,55.0 74.0,65.0 74.0,85.0 56.7,75.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,55.0 74.0,65.0 74.0,85.0 91.3,75.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="74.0,45.0 91.3,55.0 74.0,65.0 56.7,55.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="74.0,65.0 91.3,75.0 91.3,95.0 74.0,85.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,65.0 91.3,75.0 91.3,95.0 108.7,85.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,55.0 108.7,65.0 91.3,75.0 74.0,65.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,75.0 108.7,85.0 108.7,105.0 91.3,95.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="126.0,75.0 108.7,85.0 108.7,105.0 126.0,95.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,65.0 126.0,75.0 108.7,85.0 91.3,75.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,85.0 126.0,95.0 126.0,115.0 108.7,105.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="143.3,85.0 126.0,95.0 126.0,115.0 143.3,105.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="126.0,75.0 143.3,85.0 126.0,95.0 108.7,85.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,95.0 108.7,105.0 108.7,125.0 91.3,115.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="126.0,95.0 108.7,105.0 108.7,125.0 126.0,115.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,85.0 126.0,95.0 108.7,105.0 91.3,95.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/><polygon points="74.0,105.0 91.3,115.0 91.3,135.0 74.0,125.0" fill="#14365A" stroke="#14365A" stroke-width="1.3"/><polygon points="108.7,105.0 91.3,115.0 91.3,135.0 108.7,125.0" fill="#3E9B6B" stroke="#14365A" stroke-width="1.3"/><polygon points="91.3,95.0 108.7,105.0 91.3,115.0 74.0,105.0" fill="#E2F2EA" stroke="#14365A" stroke-width="1.3"/></svg>'
  };
  var ORDEM = ['A', 'B', 'C'];
  var CORRETO = 'B';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');
  var rotulos = {A:'peça A', B:'peça B', C:'peça C'};

  ORDEM.forEach(function(chave){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.dataset.valor = chave;
    b.innerHTML = ICONES[chave] + '<span class="rotulo">' + rotulos[chave] + '</span>';
    b.onclick = function(){ escolher(b, chave); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! Essa peça é a mais compacta das três.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Procure a peça com o formato mais compacto.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A peça com mais cola era a ' + rotulos[CORRETO] + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
