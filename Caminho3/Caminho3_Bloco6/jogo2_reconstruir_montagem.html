<!--
ENUNCIADO
Estas são as três fotos de uma montagem de cubinhos, de frente, de lado e de
cima. Clique na montagem, entre as quatro, que corresponde a essas três fotos.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:520px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .vistas{display:flex;justify-content:center;gap:18px;
        background:#e6f0fa;border:2px solid #2F80C4;border-radius:10px;
        padding:12px;margin-bottom:8px;flex-wrap:wrap;}
  .vista{text-align:center;}
  .vista .rot{font-size:11px;color:#1d4ed8;font-weight:700;margin-bottom:2px;}
  .rot2{text-align:center;font-size:12px;color:#6b7280;margin-bottom:16px;}
  .opcoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  button.opcao{padding:6px 2px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;
               display:flex;flex-direction:column;align-items:center;gap:2px;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:#dcfce7;border-color:var(--verde);}
  button.opcao.errada{background:#fee2e2;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  .letra{font-size:12px;font-weight:700;color:#6b7280;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>

      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! Essa montagem bate com as três fotos.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Teste essa montagem contra as três fotos, uma de cada vez.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A montagem certa era a opção ' + CORRETO + '.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
