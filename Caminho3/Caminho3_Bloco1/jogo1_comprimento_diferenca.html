<!--
ENUNCIADO
Uma fita colorida está esticada sobre uma régua que não começa a leitura
no zero. A fita vai da marca 3 cm até a marca 15 cm. Qual é o
comprimento da fita? Clique na resposta certa.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:520px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .figura{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:8px 4px;
          margin-bottom:16px;}
  .opcoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  button.opcao{padding:12px 4px;font-size:15px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;font-weight:700;
               font-family:"Courier New",monospace;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="figura">
    <svg viewBox="0 0 480 150" width="100%" xmlns="http://www.w3.org/2000/svg">
      <rect width="480" height="150" fill="#f8fafc"/>
      <rect x="94" y="30" width="288" height="24" rx="7" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.2"/>
      <text x="238" y="46" font-family="'DejaVu Sans',sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">fita colorida</text>
      <line x1="94" y1="54" x2="94" y2="80" stroke="#8A97A6" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="382" y1="54" x2="382" y2="80" stroke="#8A97A6" stroke-width="1.2" stroke-dasharray="3,3"/>
      <rect x="25" y="80" width="414" height="26" rx="4" fill="#E6F0FA" stroke="#14365A" stroke-width="2"/>
      <g font-family="'DejaVu Sans Mono',monospace" font-size="9" fill="#374151" text-anchor="middle">
        <g stroke="#14365A">
          <line x1="25" y1="80" x2="25" y2="106"/><line x1="48" y1="80" x2="48" y2="98"/><line x1="71" y1="80" x2="71" y2="98"/>
          <line x1="94" y1="80" x2="94" y2="106"/><line x1="117" y1="80" x2="117" y2="98"/><line x1="140" y1="80" x2="140" y2="98"/>
          <line x1="163" y1="80" x2="163" y2="98"/><line x1="186" y1="80" x2="186" y2="98"/><line x1="209" y1="80" x2="209" y2="106"/>
          <line x1="232" y1="80" x2="232" y2="98"/><line x1="255" y1="80" x2="255" y2="98"/><line x1="278" y1="80" x2="278" y2="98"/>
          <line x1="301" y1="80" x2="301" y2="98"/><line x1="324" y1="80" x2="324" y2="106"/><line x1="347" y1="80" x2="347" y2="98"/>
          <line x1="370" y1="80" x2="370" y2="98"/><line x1="382" y1="80" x2="382" y2="106"/><line x1="393" y1="80" x2="393" y2="98"/>
          <line x1="416" y1="80" x2="416" y2="98"/><line x1="439" y1="80" x2="439" y2="106"/>
        </g>
        <text x="25" y="120">0</text><text x="94" y="120">3</text><text x="209" y="120">8</text>
        <text x="324" y="120">13</text><text x="382" y="120">15</text><text x="439" y="120">18</text>
      </g>
      <text x="238" y="140" font-family="'DejaVu Sans',sans-serif" font-size="10.5" fill="#8A97A6" text-anchor="middle">marcas da régua, em centímetros</text>
    </svg>
  </div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var OPCOES = ['15', '3', '12', '18'];
  var CORRETO = '12';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  OPCOES.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = o + ' cm';
    b.dataset.valor = o;
    b.onclick = function(){ escolher(b, o); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! 15 − 3 = 12 cm.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Subtraia a marca do começo da marca do fim.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era ' + CORRETO + ' cm.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
