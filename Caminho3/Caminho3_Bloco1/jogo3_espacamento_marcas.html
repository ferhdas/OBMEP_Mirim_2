<!--
ENUNCIADO
Numa parede, marcas igualmente espaçadas começam no chão. O jogador
mais alto bate na marca 6 e mede 180 cm. Um colega mais baixo bate
numa marquinha, uma marca abaixo do mais alto. Qual é a altura do
colega mais baixo? Clique na resposta certa.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{--roxo:#7e22ce;--verde:#16a34a;--vermelho:#dc2626;--fundo:#faf9f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fundo);margin:0;padding:16px;color:#1f2937;}
  .painel{max-width:420px;margin:0 auto;background:#fff;border-radius:12px;padding:18px;
          box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .figura{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:6px;
          margin-bottom:16px;display:flex;justify-content:center;}
  .opcoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  button.opcao{padding:12px 4px;font-size:14px;border-radius:10px;border:2px solid #d1d5db;
               background:#fff;cursor:pointer;transition:all .2s ease;font-weight:700;
               font-family:"Courier New",monospace;}
  button.opcao:hover:not(:disabled){border-color:var(--roxo);}
  button.opcao.certa{background:var(--verde);color:#fff;border-color:var(--verde);}
  button.opcao.errada{background:var(--vermelho);color:#fff;border-color:var(--vermelho);}
  button.opcao:disabled{cursor:default;opacity:.85;}
  #msg{margin-top:14px;text-align:center;font-weight:700;min-height:22px;font-size:14px;}
</style>
</head>
<body>
<div class="painel">
  <div class="figura">
    <svg viewBox="0 0 320 260" width="280" xmlns="http://www.w3.org/2000/svg">
      <rect width="320" height="260" fill="#f8fafc"/>
      <rect x="40" y="30" width="20" height="190" rx="5" fill="#E6F0FA" stroke="#14365A" stroke-width="2"/>
      <g font-family="'DejaVu Sans Mono',monospace" font-size="10" fill="#374151" text-anchor="end">
        <g stroke="#14365A" stroke-width="1.4">
          <line x1="32" y1="220" x2="66" y2="220"/><text x="30" y="223">0</text>
          <line x1="32" y1="188.3" x2="66" y2="188.3"/><text x="30" y="191.3">1</text>
          <line x1="32" y1="156.7" x2="66" y2="156.7"/><text x="30" y="159.7">2</text>
          <line x1="32" y1="125" x2="66" y2="125"/><text x="30" y="128">3</text>
          <line x1="32" y1="93.3" x2="66" y2="93.3"/><text x="30" y="96.3">4</text>
          <line x1="32" y1="61.7" x2="66" y2="61.7"/><text x="30" y="64.7">5</text>
          <line x1="32" y1="30" x2="66" y2="30"/><text x="30" y="33">6</text>
        </g>
      </g>
      <text x="50" y="238" font-family="'DejaVu Sans',sans-serif" font-size="10" fill="#8A97A6" text-anchor="middle">chão</text>
      <line x1="66" y1="30" x2="150" y2="30" stroke="#3E9B6B" stroke-width="1.4" stroke-dasharray="3,3"/>
      <circle cx="150" cy="41" r="11" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2"/>
      <rect x="137" y="53" width="26" height="167" rx="8" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="2"/>
      <rect x="110" y="4" width="80" height="22" rx="6" fill="white" stroke="#3E9B6B" stroke-width="1.4"/>
      <text x="150" y="19" font-family="'DejaVu Sans Mono',monospace" font-size="12" font-weight="bold" fill="#2C7A54" text-anchor="middle">180 cm</text>
      <text x="150" y="238" font-family="'DejaVu Sans',sans-serif" font-size="9.5" fill="#8A97A6" text-anchor="middle">mais alto</text>
      <line x1="66" y1="61.7" x2="250" y2="61.7" stroke="#E0701B" stroke-width="1.4" stroke-dasharray="3,3"/>
      <circle cx="250" cy="72.7" r="11" fill="#FCEBD9" stroke="#E0701B" stroke-width="2"/>
      <rect x="237" y="84.7" width="26" height="135.3" rx="8" fill="#FCEBD9" stroke="#E0701B" stroke-width="2"/>
      <rect x="215" y="42" width="70" height="22" rx="6" fill="white" stroke="#E0701B" stroke-width="1.4"/>
      <text x="250" y="57" font-family="'DejaVu Sans Mono',monospace" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">?</text>
      <text x="250" y="238" font-family="'DejaVu Sans',sans-serif" font-size="9.5" fill="#8A97A6" text-anchor="middle">mais baixo</text>
    </svg>
  </div>
  <div class="opcoes" id="opcoes"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  var OPCOES = ['30', '180', '150', '120'];
  var CORRETO = '150';
  var respondido = false, tentativas = 0, inicio = Date.now();
  var cont = document.getElementById('opcoes');
  var msg = document.getElementById('msg');

  OPCOES.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opcao';
    b.textContent = o + ' cm';
    b.dataset.valor = o;
    b.onclick = function(){ escolher(b, o); };
    cont.appendChild(b);
  });

  function travarBotoes(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){ btn.disabled = true; });
  }

  function revelarCorreta(){
    Array.prototype.forEach.call(cont.querySelectorAll('button'), function(btn){
      if (btn.dataset.valor === CORRETO) btn.classList.add('certa');
    });
  }

  function enviar(acertou, valorEscolhido){
    if (respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo: 'resposta',
      acertou: acertou,
      meta: { tentativas: tentativas, tempo: Math.round((Date.now() - inicio) / 1000), resposta: valorEscolhido }
    }, '*');
  }

  function escolher(botao, valor){
    if (respondido) return;
    tentativas++;
    var acertou = (valor === CORRETO);

    if (acertou){
      botao.classList.add('certa');
      travarBotoes();
      msg.textContent = 'Isso! 180 ÷ 6 = 30, e 180 − 30 = 150.';
      msg.style.color = '#16a34a';
      enviar(true, valor);
      return;
    }

    botao.classList.add('errada');
    botao.disabled = true;

    if (tentativas < 2){
      msg.textContent = 'Ainda não. Ache o tamanho de um intervalo primeiro.';
      msg.style.color = '#dc2626';
      return;
    }

    travarBotoes();
    revelarCorreta();
    msg.textContent = 'A resposta certa era ' + CORRETO + ' cm.';
    msg.style.color = '#dc2626';
    enviar(false, valor);
  }
})();
</script>
</body>
</html>
