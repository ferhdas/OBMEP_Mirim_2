<!-- ENUNCIADO: Uma tabela é preenchida em ordem crescente, começando em 1, com 7 números em cada linha. Clique na linha e coluna onde fica o número 45. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .info{ text-align:center; font-weight:700; color:var(--navy); background:#EEE8FA; border:2px solid #7A5CC0; border-radius:10px; padding:12px; margin-bottom:14px; font-size:14px; line-height:1.6; }
  .opcoes{ display:grid; grid-template-columns:repeat(1,1fr); gap:8px; }
  button.opcao{ padding:11px 8px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:14px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; text-align:center; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:52px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="info">Tabela preenchida em ordem crescente, começando em 1, com 7 números em cada linha. Onde fica o número 45?</div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = "linha 7, coluna 3";
  var OPCOES = ["linha 6, coluna 3","linha 7, coluna 3","linha 7, coluna 2","linha 6, coluna 4","linha 8, coluna 3"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(b.textContent === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! 6 linhas completas de 7 números dão 42 (fim da linha 6). O número 45 vem 3 casas depois, na linha 7, coluna 3.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Descubra quantas linhas completas cabem antes do número 45, e o que sobra é a coluna dentro da próxima linha.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é linha 7, coluna 3: a linha 6 termina em 42 (6×7), e 45−42=3, a 3ª casa da linha 7.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é linha 7, coluna 3.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
