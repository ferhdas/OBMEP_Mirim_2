<!-- ENUNCIADO: Seis fichas numeradas de 1 a 6 são separadas em pares e guardadas em três potes. O pote A soma 8 e o pote B soma 9. Clique no número que mostra quanto soma o pote C. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; --azul:#2F80C4; --laranja:#E0701B; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:18px; }
  .painel{ max-width:560px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .potes{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .pote{ border:2.5px solid var(--azul); background:#E6F0FA; border-radius:12px; padding:10px; text-align:center; }
  .pote.alvo{ border-color:var(--laranja); background:#FCEBD9; }
  .pote .nome{ font-weight:700; color:var(--navy); margin-bottom:6px; }
  .pote .soma{ font-family:"Courier New",monospace; font-weight:700; color:var(--navy); }
  .pote.alvo .soma{ color:var(--laranja); }
  .estoque{ display:flex; justify-content:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .ficha{ width:40px; height:40px; border-radius:50%; background:#FCEFC2; border:2px solid #F6C445; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--navy); font-family:"Courier New",monospace; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:36px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="potes">
      <div class="pote"><div class="nome">Pote A</div><div class="soma">soma = 8</div></div>
      <div class="pote"><div class="nome">Pote B</div><div class="soma">soma = 9</div></div>
      <div class="pote alvo"><div class="nome">Pote C</div><div class="soma">soma = ?</div></div>
    </div>
    <div class="estoque" id="estoque"></div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var estoqueEl = document.getElementById("estoque");
  [1,2,3,4,5,6].forEach(function(n){
    var d = document.createElement("div");
    d.className = "ficha";
    d.textContent = n;
    estoqueEl.appendChild(d);
  });

  var CORRETA = 4; // pote C = {1,3}
  var OPCOES = [3,5,4,7,6];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! O pote A é 3 e 6 não funciona, então A é 4 e 5. O pote B fecha em 2 e 6. Sobram 1 e 3 para o pote C, que soma 4.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Teste os dois jeitos de fazer 8 com duas fichas e veja qual deles deixa o pote B fechar em 9.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 4: o pote A fica com 4 e 5, o pote B com 2 e 6, e sobram 1 e 3 para o pote C.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 4.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
