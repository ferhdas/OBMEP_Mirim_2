<!-- ENUNCIADO: Um robô começa no ponto (0,0) de uma grade, olhando para o Leste. Ele anda 2 casas, vira à direita, anda 4 casas, vira à direita, anda 3 casas, e para. Clique no ponto onde ele termina. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; --azul:#2F80C4; --laranja:#E0701B; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:480px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
  button.opcao{ padding:10px 2px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:13px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; font-family:monospace; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:44px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
      <polyline points="240,20 350,20 350,240 185,240" fill="none" stroke="#D8DEE6" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="240" cy="20" r="7" fill="#E0701B"/>
      <text x="240" y="10" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#E0701B">INÍCIO (0,0), olhando Leste →</text>
      <circle cx="185" cy="240" r="6" fill="#14365A"/>
      <text x="185" y="265" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#14365A">fim?</text>
    </svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = "(-1,-4)";
  var OPCOES = ["(2,-4)","(2,0)","(-1,-4)","(-1,0)","(0,0)"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(b.textContent === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! Leste 2 até (2,0), vira, Sul 4 até (2,-4), vira, Oeste 3 até (-1,-4).";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Siga trecho por trecho, marcando cada virada antes de continuar.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é (-1,-4): Leste 2, Sul 4, Oeste 3, nessa ordem.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é (-1,-4).";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
