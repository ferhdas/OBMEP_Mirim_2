<!-- ENUNCIADO: Um joalheiro transforma 3 conchas em 1 pérola, e transforma 3 pérolas em 1 concha. Sempre que uma das duas transformações é possível, ele a faz. Ele começa com 1 pérola e 7 conchas. Clique na opção que mostra com o que ele fica ao final. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .inicio{ text-align:center; font-weight:700; color:var(--navy); background:#E6F0FA; border:2px solid #2F80C4; border-radius:10px; padding:10px; margin-bottom:14px; }
  .regra{ text-align:center; font-size:13px; color:#8A97A6; font-weight:600; margin-bottom:14px; }
  .opcoes{ display:grid; grid-template-columns:repeat(1,1fr); gap:8px; }
  button.opcao{ padding:12px 10px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:15px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; text-align:left; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:56px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="inicio">Começa com: 1 pérola e 7 conchas</div>
    <div class="regra">3 conchas → 1 pérola &nbsp;·&nbsp; 3 pérolas → 1 concha &nbsp;·&nbsp; sempre que possível</div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = "0 pérolas e 2 conchas";
  var OPCOES = ["2 pérolas e 4 conchas","3 pérolas e 1 concha","0 pérolas e 2 conchas","1 pérola e 7 conchas","1 pérola e 4 conchas"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(b.textContent === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! 1p+7c -> 2p+4c -> 3p+1c -> 0p+2c, e aí nenhuma transformação cabe mais.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Aplique uma transformação de cada vez, e confira depois de cada uma se outra ainda cabe.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 0 pérolas e 2 conchas, depois de três transformações seguidas.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 0 pérolas e 2 conchas.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
