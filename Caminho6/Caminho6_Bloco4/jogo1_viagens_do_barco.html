<!-- ENUNCIADO: Um barco aguenta no máximo 150 kg por viagem. Quatro amigos pesam 40, 50, 60 e 70 kg. Clique no número que mostra o menor número de viagens que o barco deve fazer. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; --azul:#2F80C4; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .limite{ text-align:center; font-weight:700; color:var(--navy); background:#E6F0FA; border:2px solid var(--azul); border-radius:10px; padding:8px; margin-bottom:12px; }
  .pessoas{ display:flex; justify-content:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .pessoa{ width:56px; height:56px; border-radius:50%; background:#FCEFC2; border:2px solid #F6C445; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--navy); font-family:monospace; font-size:14px; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:44px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="limite">Limite do barco: 150 kg por viagem</div>
    <div class="pessoas" id="pessoas"></div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var pesos = [40,50,60,70];
  var pessoasEl = document.getElementById("pessoas");
  pesos.forEach(function(p){
    var d = document.createElement("div");
    d.className = "pessoa";
    d.textContent = p + "kg";
    pessoasEl.appendChild(d);
  });

  var CORRETA = 2; // total 220, ceil=2, {70,60}=130 e {50,40}=90 cabem
  var OPCOES = [1,3,2,4,5];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! O total é 220 kg, então 1 viagem não basta. Com 2 viagens dá: 70+60=130 e 50+40=90, as duas dentro do limite.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Some todos os pesos e divida pelo limite. Depois confira se dá para separar em grupos dentro do limite.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 2: por exemplo, uma viagem com 70+60=130 kg e outra com 50+40=90 kg.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 2.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
