<!-- ENUNCIADO: O cubo de Vitor tem as letras V, W, X, Y, Z e K, uma em cada face. Ele girou o cubo duas vezes. No primeiro giro, viu que V e W ficaram em faces opostas. No segundo giro, viu que X e Y ficaram em faces opostas. Clique na letra que está na face oposta a K. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; }
  .legenda{ text-align:center; font-size:13px; color:#8A97A6; font-weight:600; margin-top:2px; margin-bottom:8px; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:44px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg viewBox="0 0 420 190" xmlns="http://www.w3.org/2000/svg">
      <polygon points="75,15 185,15 130,60 20,60" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <polygon points="130,60 185,15 185,125 130,170" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <rect x="20" y="60" width="110" height="110" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <text x="75" y="124" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">V</text>
      <text x="102.5" y="46.5" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">W</text>
      <text x="157.5" y="101.5" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">?</text>

      <polygon points="295,15 405,15 350,60 240,60" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <polygon points="350,60 405,15 405,125 350,170" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <rect x="240" y="60" width="110" height="110" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <text x="295" y="124" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">X</text>
      <text x="322.5" y="46.5" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">Y</text>
      <text x="377.5" y="101.5" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#14365A" text-anchor="middle">?</text>
    </svg>
    <div class="legenda">1º giro: V e W opostas &nbsp;·&nbsp; 2º giro: X e Y opostas &nbsp;·&nbsp; o cubo também tem as letras Z e K</div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = "Z";
  var OPCOES = ["V","X","Z","Y","W"];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(b.textContent === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! V-W e X-Y já são dois pares. Só sobram Z e K para o terceiro par, então Z fica oposta a K.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Um cubo com 6 letras diferentes só tem 3 pares opostos. Dois já foram vistos nos giros.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é Z: as letras que sobraram depois dos dois pares vistos formam o terceiro par, Z e K.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é Z.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
