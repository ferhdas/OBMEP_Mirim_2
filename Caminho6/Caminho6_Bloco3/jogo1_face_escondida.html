<!-- ENUNCIADO: Num dado comum, a soma dos números em faces opostas é sempre 7. A face de cima está coberta, mas sabemos que ela é par. As faces visíveis mostram 3 e 6. Clique no número que mostra quantos pontos há na face de cima. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:420px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:40px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
      <polygon points="160,10 300,10 230,70 90,70" fill="#FCEBD9" stroke="#E0701B" stroke-width="2.6"/>
      <polygon points="230,70 300,10 300,150 230,210" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <rect x="90" y="70" width="140" height="140" fill="#FFFFFF" stroke="#14365A" stroke-width="2.6"/>
      <circle cx="125" cy="105" r="7" fill="#14365A"/>
      <circle cx="160" cy="140" r="7" fill="#14365A"/>
      <circle cx="195" cy="175" r="7" fill="#14365A"/>
      <text x="195" y="50" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#E0701B" text-anchor="middle">?</text>
      <circle cx="247.5" cy="83" r="7" fill="#14365A"/>
      <circle cx="282.5" cy="53" r="7" fill="#14365A"/>
      <circle cx="247.5" cy="125" r="7" fill="#14365A"/>
      <circle cx="282.5" cy="95" r="7" fill="#14365A"/>
      <circle cx="247.5" cy="167" r="7" fill="#14365A"/>
      <circle cx="282.5" cy="137" r="7" fill="#14365A"/>
    </svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = 2; // oposta a 3 é 4; oposta a 6 é 1; sobra {2,5}; par -> 2
  var OPCOES = [1,4,2,5,6];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! A oposta de 3 é 4, e a oposta de 6 é 1. Sobram 2 e 5 para cima e baixo, e a par é 2.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Ache primeiro a oposta de cada face visível, usando a regra da soma 7.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 2: sobra o par 2 e 5 para cima e baixo, e só o 2 é par.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 2.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
