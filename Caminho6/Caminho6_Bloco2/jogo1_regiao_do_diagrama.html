<!-- ENUNCIADO: Um quadrado, um círculo e um losango se cruzam, e cada número de 1 a 7 está escrito dentro de uma combinação diferente dessas três formas. Clique no número que mostra a soma dos números que estão dentro do círculo e dentro do losango, mas fora do quadrado. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:40px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg viewBox="0 0 560 580" xmlns="http://www.w3.org/2000/svg">
      <rect x="50" y="90" width="250" height="250" fill="none" stroke="#2F80C4" stroke-width="3" rx="4"/>
      <circle cx="340" cy="190" r="150" fill="none" stroke="#3E9B6B" stroke-width="3"/>
      <polygon points="80,370 250,200 420,370 250,540" fill="none" stroke="#7A5CC0" stroke-width="3"/>
      <text x="60" y="76" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#2F80C4">Quadrado</text>
      <text x="340" y="26" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#3E9B6B" text-anchor="middle">Círculo</text>
      <text x="220" y="564" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#7A5CC0">Losango</text>
      <circle cx="115" cy="204" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="115" y="210" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">3</text>
      <circle cx="386" cy="171" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="386" y="177" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">6</text>
      <circle cx="248" cy="411" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="248" y="417" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">1</text>
      <circle cx="244" cy="163" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="244" y="169" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">5</text>
      <circle cx="190" cy="313" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="190" y="319" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">2</text>
      <circle cx="332" cy="315" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="332" y="321" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">7</text>
      <circle cx="257" cy="272" r="20" fill="#fff" stroke="#14365A" stroke-width="2.4"/>
      <text x="257" y="278" font-family="monospace" font-size="18" font-weight="bold" fill="#14365A" text-anchor="middle">4</text>
    </svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = 7; // dentro do círculo e do losango, fora do quadrado: só o número 7
  var OPCOES = [4,11,7,9,5];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! O número 4 também está no círculo e no losango, mas como está dentro do quadrado também, ele sai. Só sobra o 7.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Liste quem está dentro do círculo, depois quem está dentro do losango, e só então tire quem também está no quadrado.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 7: é o único número dentro do círculo e do losango que não está também dentro do quadrado.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 7.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
