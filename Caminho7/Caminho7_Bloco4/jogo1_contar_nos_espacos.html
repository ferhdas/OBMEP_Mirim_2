<!-- ENUNCIADO: Seis amigos ficam em fila. Entre cada dois amigos vizinhos, os organizadores colocam 4 bandeirinhas. Clique no número que mostra quantos itens há ao todo na fila, amigos e bandeirinhas juntos. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; --azul:#2F80C4; --laranja:#E0701B; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:520px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .fila{ display:flex; justify-content:center; align-items:flex-end; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
  .pessoa{ width:26px; height:34px; display:flex; flex-direction:column; align-items:center; }
  .cabeca{ width:14px; height:14px; border-radius:50%; background:#E6F0FA; border:2px solid var(--azul); }
  .corpo{ width:24px; height:16px; border-radius:12px 12px 0 0; background:#E6F0FA; border:2px solid var(--azul); border-bottom:none; margin-top:2px; }
  .espaco{ display:flex; gap:2px; align-items:flex-end; margin-bottom:6px; }
  .bandeira{ width:8px; height:14px; background:var(--laranja); clip-path:polygon(0 0,100% 50%,0 100%); }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:52px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="fila" id="fila"></div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var N_AMIGOS = 6, POR_ESPACO = 4;
  var filaEl = document.getElementById("fila");
  function pessoa(){
    var d = document.createElement("div"); d.className = "pessoa";
    var c = document.createElement("div"); c.className = "cabeca";
    var b = document.createElement("div"); b.className = "corpo";
    d.appendChild(c); d.appendChild(b);
    return d;
  }
  function espaco(){
    var d = document.createElement("div"); d.className = "espaco";
    for(var i=0;i<POR_ESPACO;i++){
      var f = document.createElement("div"); f.className = "bandeira";
      d.appendChild(f);
    }
    return d;
  }
  for(var i=0;i<N_AMIGOS;i++){
    filaEl.appendChild(pessoa());
    if(i < N_AMIGOS-1) filaEl.appendChild(espaco());
  }

  var CORRETA = 26; // 6 + 5*4
  var OPCOES = [20,24,26,30,22];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! 6 amigos têm 5 espaços entre vizinhos. 5x4=20 bandeirinhas. 6+20=26.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Conte quantos espaços existem entre os 6 amigos (é um a menos que 6).";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 26: 5 espaços x 4 bandeirinhas = 20, mais os 6 amigos.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 26.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
