<!-- ENUNCIADO: O mosaico abaixo tem 16 quadrados, cada um dividido por uma diagonal em dois triângulos. Clique no número que mostra quantos triângulos brancos há no mosaico. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:400px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; margin-bottom:8px; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:40px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">

polygon points="70,70 70,130 130,130" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><line x1="70" y1="70" x2="130" y2="130" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="130" y="70" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="130,70 190,70 190,130" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><polygon points="130,70 130,130 190,130" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><line x1="130" y1="70" x2="190" y2="130" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="190" y="70" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="190,70 250,70 250,130" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><polygon points="190,70 190,130 250,130" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><line x1="190" y1="70" x2="250" y2="130" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="10" y="130" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="10,130 70,130 70,190" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><polygon points="10,130 10,190 70,190" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><line x1="10" y1="130" x2="70" y2="190" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="70" y="130" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="70,130 130,130 70,190" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><polygon points="130,130 130,190 70,190" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><line x1="130" y1="130" x2="70" y2="190" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="130" y="130" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="130,130 190,130 190,190" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><polygon points="130,130 130,190 190,190" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><line x1="130" y1="130" x2="190" y2="190" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="190" y="130" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="190,130 250,130 250,190" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><polygon points="190,130 190,190 250,190" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><line x1="190" y1="130" x2="250" y2="190" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="10" y="190" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="10,190 70,190 70,250" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><polygon points="10,190 10,250 70,250" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><line x1="10" y1="190" x2="70" y2="250" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="70" y="190" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="70,190 130,190 130,250" fill="#E2F2EA" stroke="#3E9B6B" stroke-width="1.3"/><polygon points="70,190 70,250 130,250" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><line x1="70" y1="190" x2="130" y2="250" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="130" y="190" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="130,190 190,190 130,250" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><polygon points="190,190 190,250 130,250" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><line x1="190" y1="190" x2="130" y2="250" stroke="#14365A" stroke-width="1.2" opacity="0.55"/><rect x="190" y="190" width="60" height="60" fill="none" stroke="#CBD5DF" stroke-width="1.5"/><polygon points="190,190 250,190 190,250" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><polygon points="250,190 250,250 190,250" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><line x1="250" y1="190" x2="190" y2="250" stroke="#14365A" stroke-width="1.2" opacity="0.55"/>
    </svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = 18;
  var OPCOES = [14,16,18,20,12];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! Contando linha por linha, sem pular nenhum quadrado, o total de triângulos brancos é 18.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Conte linha por linha, de cima para baixo, sem pular nenhum quadrado.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 18.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 18.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
