<!-- ENUNCIADO: Carla tem 4 canecas (azul, verde, vermelha, amarela) e 3 pratinhos (azul, verde, vermelha). Clique no número que mostra de quantas maneiras ela pode escolher uma caneca e um pratinho de cores diferentes. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .linha{ display:flex; justify-content:center; gap:20px; margin-bottom:16px; }
  .grupo{ text-align:center; }
  .grupo .rotulo{ font-weight:700; color:var(--navy); margin-bottom:8px; font-size:13px; }
  .item{ width:28px; height:28px; border-radius:50%; margin:3px; display:inline-block; border:2.4px solid; }
  #fb{ margin-top:12px; min-height:52px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="linha">
      <div class="grupo">
        <div class="rotulo">Canecas</div>
        <div id="canecas"></div>
      </div>
      <div class="grupo">
        <div class="rotulo">Pratinhos</div>
        <div id="pratinhos"></div>
      </div>
    </div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORES = { azul:["#2F80C4","#E6F0FA"], verde:["#3E9B6B","#E2F2EA"], vermelha:["#C0392B","#FCEBD9"], amarela:["#B8860B","#FCEFC2"] };
  var canecas = ["azul","verde","vermelha","amarela"];
  var pratinhos = ["azul","verde","vermelha"];
  var canecasEl = document.getElementById("canecas");
  var pratinhosEl = document.getElementById("pratinhos");
  canecas.forEach(function(c){
    var d = document.createElement("span"); d.className="item";
    d.style.borderColor = CORES[c][0]; d.style.background = CORES[c][1];
    canecasEl.appendChild(d);
  });
  pratinhos.forEach(function(c){
    var d = document.createElement("span"); d.className="item";
    d.style.borderColor = CORES[c][0]; d.style.background = CORES[c][1];
    pratinhosEl.appendChild(d);
  });

  var CORRETA = 9; // 4*3 - 3
  var OPCOES = [12,9,10,7,8];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! 4x3=12 no total, menos 3 combinações de mesma cor (azul-azul, verde-verde, vermelha-vermelha) = 9.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Calcule o produto total primeiro, depois tire as combinações de mesma cor.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 9: 4x3=12, menos as 3 combinações de mesma cor.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 9.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
