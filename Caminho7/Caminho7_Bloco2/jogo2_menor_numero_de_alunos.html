<!-- ENUNCIADO: Alguns alunos tiraram as botas depois da chuva. Entre as botas soltas, há 8 botas do pé esquerdo e 5 botas do pé direito. Clique no número que mostra o menor número de alunos que podem ter usado essas botas. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .linha{ display:flex; justify-content:center; gap:24px; margin-bottom:14px; }
  .grupo{ text-align:center; }
  .grupo .rotulo{ font-weight:700; color:var(--navy); margin-bottom:6px; }
  .bota{ display:inline-block; width:26px; height:40px; border-radius:8px 8px 4px 4px; margin:2px; }
  .bota.esq{ background:#E6F0FA; border:2.4px solid #2F80C4; }
  .bota.dir{ background:#FCEBD9; border:2.4px solid #E0701B; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:44px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="linha">
      <div class="grupo">
        <div class="rotulo">Pé esquerdo (8)</div>
        <div id="esq"></div>
      </div>
      <div class="grupo">
        <div class="rotulo">Pé direito (5)</div>
        <div id="dir"></div>
      </div>
    </div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var esqEl = document.getElementById("esq");
  var dirEl = document.getElementById("dir");
  for(var i=0;i<8;i++){ var d=document.createElement("span"); d.className="bota esq"; esqEl.appendChild(d); }
  for(var i=0;i<5;i++){ var d=document.createElement("span"); d.className="bota dir"; dirEl.appendChild(d); }

  var CORRETA = 8; // max(8,5)
  var OPCOES = [5,13,8,3,10];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! 5 botas direitas pareiam com 5 esquerdas, sobrando 3 botas esquerdas sem par. 5+3 = 8.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. O menor número de alunos é igual à contagem do lado que mais aparece, não à soma dos dois lados.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 8, o mesmo que a contagem de botas do pé esquerdo, o lado que mais aparece.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 8.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
