<!-- ENUNCIADO: As meias abaixo estão todas misturadas, cada uma marcada com o número do seu dono. Clique no número que mostra quantos pares completos, com o mesmo número, dá para formar. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; margin-bottom:8px; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:44px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <svg viewBox="0 0 600 205" xmlns="http://www.w3.org/2000/svg">
<g transform="rotate(24.83589734051234 56.72128746817149 53.32265326858489)"><rect x="39.921287468171485" y="25.322653268584887" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="56.72128746817149" y="59.32265326858489" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">17</text><g transform="rotate(17.628666055907644 134.74454527555366 60.8061425394657)"><rect x="117.94454527555366" y="32.8061425394657" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="134.74454527555366" y="66.8061425394657" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">17</text><g transform="rotate(-1.111794756363345 290.56689210816216 116.49842598729659)"><rect x="273.76689210816215" y="88.49842598729659" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="290.56689210816216" y="122.49842598729659" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">20</text><g transform="rotate(5.792029313626852 469.6252611691935 51.13157844668096)"><rect x="452.8252611691935" y="23.13157844668096" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="469.6252611691935" y="57.13157844668096" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">23</text><g transform="rotate(21.321259757884413 52.34418786302871 122.82814705908758)"><rect x="35.54418786302871" y="94.82814705908758" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="52.34418786302871" y="128.8281470590876" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">20</text><g transform="rotate(13.01439852620424 386.9090204410779 115.71948796787375)"><rect x="370.1090204410779" y="87.71948796787375" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="386.9090204410779" y="121.71948796787375" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">26</text><g transform="rotate(-1.493896911735348 543.7632459337055 59.04666681599447)"><rect x="526.9632459337056" y="31.04666681599447" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="543.7632459337055" y="65.04666681599447" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">23</text><g transform="rotate(16.210891227752178 389.7995349358424 60.83399711009065)"><rect x="372.9995349358424" y="32.83399711009065" width="33.6" height="56" rx="15.400000000000002" fill="#E6F0FA" stroke="#2F80C4" stroke-width="2.4"/></g><text x="389.7995349358424" y="66.83399711009065" font-family="DejaVu Sans Mono" font-size="15" font-weight="bold" fill="#14365A" text-anchor="middle">29</text>
    </svg>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = 3; // 17x2, 20x2, 23x2 pareiam; 26 e 29 sobram sozinhos
  var OPCOES = [2,4,3,5,1];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! O 17, o 20 e o 23 aparecem duas vezes cada, formando 3 pares. O 26 e o 29 aparecem sozinhos e ficam sem par.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Conte quantas vezes cada número aparece antes de formar os pares.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 3: os números 17, 20 e 23 formam um par cada.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 3.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
