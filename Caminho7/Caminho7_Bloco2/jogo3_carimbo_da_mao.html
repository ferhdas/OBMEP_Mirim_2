<!-- ENUNCIADO: Dez crianças carimbaram as mãos numa folha, formando 10 carimbos dispostos em círculo. Um carimbo de mão esquerda tem o dedão do lado direito da figura. Clique no número que mostra quantas vezes a mão esquerda foi carimbada. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:420px; margin:0 auto; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  svg{ width:100%; height:auto; display:block; margin-bottom:8px; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:44px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>

    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var CORRETA = 6; // 6 carimbos com dedao a direita (mao esquerda)
  var OPCOES = [4,10,6,8,2];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! Conte os carimbos com o dedão do lado direito da figura, eles são de mão esquerda. São 6.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Lembre-se: dedão do lado direito da figura = carimbo de mão esquerda.";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 6: são 6 carimbos com o dedão do lado direito.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 6.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
