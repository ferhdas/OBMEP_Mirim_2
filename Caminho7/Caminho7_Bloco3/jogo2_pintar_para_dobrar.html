<!-- ENUNCIADO: Um colar tem 9 contas, 1 preta e 8 brancas. Clique no número que mostra quantas contas brancas devem ser pintadas de preto para que o número de contas pretas fique igual ao dobro do número de contas brancas. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root{ --roxo:#7e22ce; --verde:#16a34a; --vermelho:#dc2626; --fundo:#faf9f5; --navy:#14365A; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--fundo); margin:0; padding:14px; }
  .painel{ max-width:460px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); }
  .colar{ display:flex; justify-content:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .conta{ width:34px; height:34px; border-radius:50%; border:2.4px solid #14365A; }
  .conta.preta{ background:#2b2b2b; border-color:#2b2b2b; }
  .conta.branca{ background:#fff; }
  .opcoes{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  button.opcao{ padding:12px 4px; border-radius:10px; border:2px solid #ddd; background:#fff; font-size:18px; font-weight:700; color:#333; cursor:pointer; transition:all .2s; }
  button.opcao:hover:not(:disabled){ border-color:var(--roxo); }
  button.opcao:disabled{ cursor:default; }
  button.opcao.certa{ background:#e9f9ef; border-color:var(--verde); color:var(--verde); }
  button.opcao.errada{ background:#fdecea; border-color:var(--vermelho); color:var(--vermelho); }
  #fb{ margin-top:12px; min-height:52px; font-weight:600; font-size:14px; text-align:center; }
  #fb.ok{ color:var(--verde); } #fb.no{ color:var(--vermelho); }
  #desistir{ display:block; margin:14px auto 0; background:none; border:none; color:#999; font-size:12px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <div class="painel">
    <div class="colar" id="colar"></div>
    <div class="opcoes" id="opcoes"></div>
    <div id="fb"></div>
    <button id="desistir">Desistir</button>
  </div>

<script>
  var pretas = 1, brancas = 8;
  var itens = [];
  for(var i=0;i<pretas;i++) itens.push("preta");
  for(var i=0;i<brancas;i++) itens.push("branca");
  itens.sort(function(){ return Math.random()-0.5; });
  var colarEl = document.getElementById("colar");
  itens.forEach(function(t){
    var d = document.createElement("div");
    d.className = "conta " + t;
    colarEl.appendChild(d);
  });

  var CORRETA = 5; // 1+x = 2(8-x) -> x=5
  var OPCOES = [3,6,5,4,7];

  var respondido = false, tentativas = 0, inicio = Date.now();
  var opcoesEl = document.getElementById("opcoes");
  var fb = document.getElementById("fb");
  var botoes = [];

  OPCOES.forEach(function(valor){
    var b = document.createElement("button");
    b.className = "opcao";
    b.textContent = valor;
    b.onclick = function(){ escolher(b, valor); };
    opcoesEl.appendChild(b);
    botoes.push(b);
  });

  function travarBotoes(){ botoes.forEach(function(b){ b.disabled = true; }); }
  function revelarCorreta(){
    botoes.forEach(function(b){ if(parseInt(b.textContent,10) === CORRETA) b.classList.add("certa"); });
  }

  function enviar(acertou, resposta){
    if(respondido) return;
    respondido = true;
    window.parent.postMessage({
      tipo:"resposta", acertou: acertou,
      meta:{ tentativas: tentativas, tempo: Math.round((Date.now()-inicio)/1000), resposta: resposta }
    }, "*");
  }

  function escolher(botao, valor){
    if(respondido) return;
    tentativas++;
    if(valor === CORRETA){
      botao.classList.add("certa");
      travarBotoes();
      fb.textContent = "Isso! 1+x = 2(8-x) dá x=5. Depois de pintar: 6 pretas e 3 brancas, e 6 é o dobro de 3.";
      fb.className = "ok";
      enviar(true, valor);
    } else {
      botao.classList.add("errada");
      botao.disabled = true;
      if(tentativas < 2){
        fb.textContent = "Ainda não. Monte a equação: pretas + x = 2 vezes (brancas - x).";
        fb.className = "no";
      } else {
        travarBotoes();
        revelarCorreta();
        fb.textContent = "A resposta certa é 5: a equação 1+x = 2(8-x) dá x=5.";
        fb.className = "no";
        enviar(false, valor);
      }
    }
  }

  document.getElementById("desistir").onclick = function(){
    if(respondido) return;
    travarBotoes();
    revelarCorreta();
    fb.textContent = "Sem problema. A resposta certa é 5.";
    fb.className = "no";
    enviar(false, null);
  };
</script>
</body>
</html>
